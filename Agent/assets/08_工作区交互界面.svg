<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="title description">
  <title id="title">图 8  统一工作区与图形交互</title>
  <desc id="description">布局与运行状态均为目标设计示意；Team、Workflow 和 Run 分开编辑或查看，Chat 共享同一任务上下文。</desc>
  <g id="background">
    <rect x="0" y="0" width="1760" height="1220" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="128" x2="1712" y2="128" stroke="#E2E9EF" stroke-width="1.5" />
    <rect x="48" y="248" width="250" height="864" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="316" y="248" width="1000" height="548" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="1332" y="248" width="380" height="548" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="316" y="814" width="1000" height="298" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="1332" y="814" width="380" height="298" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.4" />
    <line x1="48" y1="1140" x2="1712" y2="1140" stroke="#E2E9EF" stroke-width="1.3" />
  </g>
  <g id="nodes">
    <rect x="48" y="164" width="1664" height="68" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="1240" y="180" width="112" height="36" rx="8" fill="#EAF6F1" stroke="none" stroke-width="1.4" />
    <rect x="1370" y="180" width="112" height="36" rx="8" fill="#FFF5E3" stroke="none" stroke-width="1.4" />
    <rect x="1500" y="180" width="112" height="36" rx="8" fill="#EEF5FC" stroke="none" stroke-width="1.4" />
    <g id="spec">
      <title>规格确认</title>
      <rect x="370" y="358" width="216" height="86" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="371" y="375" width="4" height="52" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="dev">
      <title>并行开发</title>
      <rect x="710" y="358" width="216" height="86" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="711" y="375" width="4" height="52" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="gate">
      <title>独立验收</title>
      <rect x="1050" y="358" width="216" height="86" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1051" y="375" width="4" height="52" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="regression">
      <title>系统回归</title>
      <rect x="1050" y="626" width="216" height="86" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1051" y="643" width="4" height="52" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="release">
      <title>发布交付</title>
      <rect x="710" y="626" width="216" height="86" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="711" y="643" width="4" height="52" rx="2" fill="#197767" stroke="none" />
    </g>
    <rect x="342" y="884" width="866" height="60" rx="10" fill="#EEF5FC" stroke="none" stroke-width="1.4" />
    <rect x="390" y="960" width="890" height="60" rx="10" fill="#EAF6F1" stroke="none" stroke-width="1.4" />
    <rect x="342" y="1040" width="938" height="48" rx="9" fill="#F3F6F9" stroke="none" stroke-width="1.4" />
  </g>
  <g id="connections">
    <g id="e01" data-source="spec" data-target="dev">
      <title>规格确认后开始并行开发</title>
      <polyline points="586,401 698,401" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="710,401 698,406.5 698,395.5" fill="#28649B" />
    </g>
    <g id="e02" data-source="dev" data-target="gate">
      <title>开发提交到独立验收</title>
      <polyline points="926,401 1038,401" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1050,401 1038,406.5 1038,395.5" fill="#28649B" />
    </g>
    <g id="e03" data-source="gate" data-target="regression">
      <title>验收通过后开始系统回归</title>
      <polyline points="1201.2,444 1201.2,614" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1201.2,626 1195.7,614 1206.7,614" fill="#197767" />
    </g>
    <g id="e04" data-source="gate" data-target="dev">
      <title>验收失败且预算允许时退回开发</title>
      <polyline points="1104,444 1104,530 818,530 818,456" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
      <polygon points="818,444 823.5,456 812.5,456" fill="#9B6419" />
    </g>
    <g id="e05" data-source="regression" data-target="release">
      <title>系统回归通过后发布交付</title>
      <polyline points="1050,669 938,669" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="926,669 938,663.5 938,674.5" fill="#197767" />
    </g>
  </g>
