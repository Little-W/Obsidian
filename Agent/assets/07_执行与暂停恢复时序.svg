ound" stroke-width="2.6" /><text fill="#188671" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="837.5" y="575">返回工具结果</text><path d="M695 651 H1252" fill="none" marker-end="url(#07_执行与暂停恢复时序_svg_teal)" opacity="1" stroke="#188671" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#188671" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="980.0" y="639">提交交付物和证据</text><path d="M1265 715 H1547" fill="none" marker-end="url(#07_执行与暂停恢复时序_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#AD6C18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1412.5" y="703">记录审核结果</text><path d="M1265 779 H423" fill="none" marker-end="url(#07_执行与暂停恢复时序_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#AD6C18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="837.5" y="767">拒绝 / 通过 / 人审</text><path d="M410 843 H138" fill="none" marker-end="url(#07_执行与暂停恢复时序_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#AD6C18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="267.5" y="831">待审批时暂停并通知</text><path d="M125 907 H397" fill="none" marker-end="url(#07_执行与暂停恢复时序_svg_teal)" opacity="1" stroke="#188671" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#188671" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="267.5" y="895">批准后 Resume（同一 Thread）</text><path d="M410 971 H1547" fill="none" marker-end="url(#07_执行与暂停恢复时序_svg_teal)" opacity="1" stroke="#188671" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#188671" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="985.0" y="959">提交状态变化与新事件</text></svg>