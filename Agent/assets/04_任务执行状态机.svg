<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="title description">
  <title id="title">图 4  任务状态与有界返工</title>
  <desc id="description">任务和执行尝试分开记录；验收失败后重新排队，不允许直接跳到“执行中”或“已通过”。</desc>
  <g id="background">
    <rect x="0" y="0" width="1760" height="1220" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="128" x2="1712" y2="128" stroke="#E2E9EF" stroke-width="1.5" />
    <rect x="48" y="636" width="1060" height="84" rx="10" fill="#F3F6F9" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="1140" x2="1712" y2="1140" stroke="#E2E9EF" stroke-width="1.3" />
  </g>
  <g id="nodes">
    <g id="created">
      <title>已创建；Created</title>
      <rect x="48" y="254" width="204" height="114" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="49" y="271" width="4" height="80" rx="2" fill="#64778A" stroke="none" />
    </g>
    <g id="ready">
      <title>可执行；Ready</title>
      <rect x="340" y="254" width="204" height="114" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="341" y="271" width="4" height="80" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="claimed">
      <title>已领取；Claimed</title>
      <rect x="632" y="254" width="204" height="114" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="633" y="271" width="4" height="80" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="running">
      <title>执行中；Running</title>
      <rect x="924" y="254" width="204" height="114" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="925" y="271" width="4" height="80" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="review">
      <title>待验收；Review</title>
      <rect x="1216" y="254" width="204" height="114" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1217" y="271" width="4" height="80" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="accepted">
      <title>已通过；Accepted</title>
      <rect x="1508" y="254" width="204" height="114" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1509" y="271" width="4" height="80" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="rework">
      <title>待修复 / Rework；保留缺陷、日志和旧 Attempt；返工次数与修改范围受限</title>
      <rect x="1216" y="540" width="320" height="120" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1217" y="557" width="4" height="86" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="human">
      <title>等待人工 / Waiting Human；触发：当前阶段要求人工决策。；批准：恢复被暂停阶段的检查。；拒绝：按规则返工、阻塞或取消。；不能因批准而绕过后续验收。</title>
      <rect x="48" y="834" width="496" height="224" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="49" y="851" width="4" height="190" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="blocked">
      <title>已阻塞 / Blocked；触发：外部故障、预算或权限问题。；解除后先核对执行账本与产物。；可恢复：从安全暂停点继续。；需重试：新建 Attempt 后回到 Ready。</title>
      <rect x="632" y="834" width="496" height="224" rx="12" fill="#FCEDF0" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="633" y="851" width="4" height="190" rx="2" fill="#A54350" stroke="none" />
    </g>
    <g id="cancelled">
      <title>已取消 / Cancelled；触发：用户停止或明确终止策略。；确认进程与资源已妥善处理。；本次运行终止，不自动恢复。；再次执行需显式创建新的运行。</title>
      <rect x="1216" y="834" width="496" height="224" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1217" y="851" width="4" height="190" rx="2" fill="#64778A" stroke="none" />
    </g>
  </g>
  <g id="connections">
    <g id="e01" data-source="created" data-target="ready">
      <title>依赖满足</title>
      <polyline points="252,311 328,311" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="340,311 328,316.5 328,305.5" fill="#28649B" />
    </g>
    <g id="e02" data-source="ready" data-target="claimed">
      <title>领取</title>
      <polyline points="544,311 620,311" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="632,311 620,316.5 620,305.5" fill="#28649B" />
    </g>
    <g id="e03" data-source="claimed" data-target="running">
      <title>启动</title>
      <polyline points="836,311 912,311" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="924,311 912,316.5 912,305.5" fill="#28649B" />
    </g>
    <g id="e04" data-source="running" data-target="review">
      <title>提交</title>
      <polyline points="1128,311 1204,311" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1216,311 1204,316.5 1204,305.5" fill="#28649B" />
    </g>
    <g id="e05" data-source="review" data-target="accepted">
      <title>验收通过</title>
      <polyline points="1420,311 1496,311" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1508,311 1496,316.5 1496,305.5" fill="#197767" />
    </g>
    <g id="e06" data-source="review" data-target="rework">
      <title>审核拒绝，且可修复、预算充足</title>
      <polyline points="1318,368 1318,528" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1318,540 1312.5,528 1323.5,528" fill="#9B6419" />
    </g>
    <g id="e07" data-source="rework" data-target="ready">
      <title>新建 Attempt，重新检查前置条件并进入 Ready</title>
      <polyline points="1216,600 442,600 442,380" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
      <polygon points="442,368 447.5,380 436.5,380" fill="#9B6419" />
    </g>
  </g>
  <g id="labels" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="48" y="64" font-size="25" fill="#28649B" font-weight="700" text-anchor="start">04</text>
    <text x="112" y="64" font-size="34" fill="#18324B" font-weight="700" text-anchor="start">任务状态与有界返工</text>
    <text x="48" y="105" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">任务和执行尝试分开记录；验收失败后重新排队，不允许直接跳到“执行中”或“已通过”。</text>
    <text x="48" y="184" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">A  正常路径与可修复的验收失败</text>
    <text x="150.0" y="290" font-size="24" fill="#18324B" font-weight="700" text-anchor="middle">已创建</text>
    <text x="150.0" y="321" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">Created</text>
    <text x="442.0" y="290" font-size="24" fill="#18324B" font-weight="700" text-anchor="middle">可执行</text>
    <text x="442.0" y="321" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">Ready</text>
    <text x="734.0" y="290" font-size="24" fill="#18324B" font-weight="700" text-anchor="middle">已领取</text>
    <text x="734.0" y="321" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">Claimed</text>
    <text x="1026.0" y="290" font-size="24" fill="#18324B" font-weight="700" text-anchor="middle">执行中</text>
    <text x="1026.0" y="321" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">Running</text>
    <text x="1318.0" y="290" font-size="24" fill="#18324B" font-weight="700" text-anchor="middle">待验收</text>
    <text x="1318.0" y="321" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">Review</text>
    <text x="1610.0" y="290" font-size="24" fill="#18324B" font-weight="700" text-anchor="middle">已通过</text>
    <text x="1610.0" y="321" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">Accepted</text>
    <text x="296.0" y="294" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">依赖满足</text>
    <text x="588.0" y="294" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">领取</text>
    <text x="880.0" y="294" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">启动</text>
    <text x="1172.0" y="294" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">提交</text>
    <text x="1464.0" y="294" font-size="17" fill="#197767" font-weight="400" text-anchor="middle">验收通过</text>
    <text x="1376.0" y="576" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">待修复 / Rework</text>
    <text x="1376.0" y="607" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">保留缺陷、日志和旧 Attempt</text>
    <text x="1376.0" y="634" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">返工次数与修改范围受限</text>
    <text x="1340" y="460" font-size="18" fill="#9B6419" font-weight="400" text-anchor="start">可修复、预算充足</text>
    <text x="814" y="579" font-size="19" fill="#9B6419" font-weight="400" text-anchor="middle">新建 Attempt → 重新排队 → 再次领取</text>
    <text x="68" y="666" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">Accepted 必须有可核验的交付物、工具记录和独立验收。</text>
    <text x="68" y="694" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">模型报告、工具退出码为 0，都不能单独替代工程验收。</text>
    <text x="48" y="759" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">B  异常状态的进入与恢复规则</text>
    <text x="48" y="795" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">以下规则作用于适用的非终态；不把所有异常统一画成“直接恢复执行”。</text>
    <text x="70" y="870" font-size="23" fill="#18324B" font-weight="700" text-anchor="start">等待人工 / Waiting Human</text>
    <text x="70" y="901" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">触发：当前阶段要求人工决策。</text>
    <text x="70" y="928" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">批准：恢复被暂停阶段的检查。</text>
    <text x="70" y="955" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">拒绝：按规则返工、阻塞或取消。</text>
    <text x="70" y="982" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">不能因批准而绕过后续验收。</text>
    <text x="654" y="870" font-size="23" fill="#18324B" font-weight="700" text-anchor="start">已阻塞 / Blocked</text>
    <text x="654" y="901" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">触发：外部故障、预算或权限问题。</text>
    <text x="654" y="928" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">解除后先核对执行账本与产物。</text>
    <text x="654" y="955" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">可恢复：从安全暂停点继续。</text>
    <text x="654" y="982" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">需重试：新建 Attempt 后回到 Ready。</text>
    <text x="1238" y="870" font-size="23" fill="#18324B" font-weight="700" text-anchor="start">已取消 / Cancelled</text>
    <text x="1238" y="901" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">触发：用户停止或明确终止策略。</text>
    <text x="1238" y="928" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">确认进程与资源已妥善处理。</text>
    <text x="1238" y="955" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">本次运行终止，不自动恢复。</text>
    <text x="1238" y="982" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">再次执行需显式创建新的运行。</text>
    <text x="48" y="1166" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">上图箭头只表示 A 部分的状态转移；B 部分说明异常恢复条件。旧 Attempt 与已接受的历史证据均不可覆盖。</text>
  </g>
</svg>