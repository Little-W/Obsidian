xt fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="425.0" y="262">可执行</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="425.0" y="292">Ready</text><rect fill="#EAF3FC" height="126" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="234" x="578" y="230" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="695.0" y="262">已领取</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="695.0" y="292">Claimed</text><rect fill="#E4F4EF" height="126" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="234" x="848" y="230" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="965.0" y="262">执行中</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="965.0" y="292">Running</text><rect fill="#FFF4DB" height="126" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="234" x="1118" y="230" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="1235.0" y="262">待验收</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1235.0" y="292">Review</text><rect fill="#E4F4EF" height="126" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="234" x="1388" y="230" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="1505.0" y="262">已通过</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1505.0" y="292">Accepted</text><path d="M277,292 L300,292" fill="none" marker-end="url(#04_任务执行状态机_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M547,292 L570,292" fill="none" marker-end="url(#04_任务执行状态机_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M817,292 L840,292" fill="none" marker-end="url(#04_任务执行状态机_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M1087,292 L1110,292" fill="none" marker-end="url(#04_任务执行状态机_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M1357,292 L1380,292" fill="none" marker-end="url(#04_任务执行状态机_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#2365A2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="833" y="206">正常推进</text><rect fill="#FFF4DB" height="116" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="280" x="820" y="505" /><rect fill="#AD6C18" height="96" rx="2" width="5" x="820" y="515" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="960.0" y="537">待修复 / Rework</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="960.0" y="567">保留证据与原始缺陷</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="960.0" y="591">返工次数受预算约束</text><path d="M1235 356 V458 H960 V499" fill="none" marker-end="url(#04_任务执行状态机_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#AD6C18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" x="1105" y="445">审核拒绝且可修复</text><path d="M900 505 V420 H965 V363" fill="none" marker-end="url(#04_任务执行状态机_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#AD6C18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" x="758" y="407">修复后重新提交</text><rect fill="#FDEDEE" height="115" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="340" x="1220" y="625" /><rect fill="#B74D53" height="95" rx="2" width="5" x="1220" y="635" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="1390.0" y="657">阻塞 / 需要人工决策</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1390.0" y="687">外部工具故障、预算耗尽</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1390.0" y="711">或涉及不可自动处理的风险</text><path d="M1100 560 H1170 V682 H1214" fill="none" marker-end="url(#04_任务执行状态机_svg_red)" opacity="1" stroke="#B74D53" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M1235 458 H1400 V619" fill="none" marker-end="url(#04_任务执行状态机_svg_red)" opacity="1" stroke="#B74D53" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" /><text fill="#B74D53" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" x="1433" y="470">无可接受证据</text><rect fill="#F1F5F9" height="80" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="950" x="115" y="670" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" x="145" y="705">失败不等于可以无限重试：</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="145" y="734">按错误类别、尝试次数、成本预算、修改范围决定下一步。</text></svg>