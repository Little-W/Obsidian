<svg baseProfile="full" height="815px" version="1.1" viewBox="0 0 1680 815" width="1680px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="06_交付物与验收证据_svg_gray" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#8AA0B1" /></marker><marker id="06_交付物与验收证据_svg_blue" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2365A2" /></marker><marker id="06_交付物与验收证据_svg_teal" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#188671" /></marker><marker id="06_交付物与验收证据_svg_amber" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#AD6C18" /></marker><marker id="06_交付物与验收证据_svg_red" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#B74D53" /></marker></defs><rect fill="#FFFFFF" height="815" width="1680" x="0" y="0" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="bold" x="40" y="51">图 6  交付物、证据及版本继承</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" x="42" y="86">Agent 的自述只是一种报告；工具记录、文件哈希与独立校验共同构成可审查的任务验收证据。</text><line stroke="#E2E8F0" stroke-width="1.5" x1="40" x2="1640" y1="105" y2="105" /><rect fill="#EAF3FC" height="156" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="260" x="50" y="230" /><rect fill="#2365A2" height="136" rx="2" width="5" x="50" y="240" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" x="72" y="262">任务与输入契约</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="72" y="292">Spec 版本 / 验收标准</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="72" y="316">目标文件与允许修改范围</text><rect fill="#E4F4EF" height="156" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="260" x="380" y="230" /><rect fill="#188671" height="136" rx="2" width="5" x="380" y="240" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" x="402" y="262">隔离工作区</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="402" y="292">Agent 编码 / 执行工具</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="402" y="316">保存源代码、命令和日志</text><rect fill="#FFF4DB" height="156" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="260" x="710" y="230" /><rect fill="#AD6C18" height="136" rx="2" width="5" x="710" y="240" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" x="732" y="262">证据采集</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="732" y="292">退出码 / 工具版本 / 时间</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="732" y="316">报告文件 / 结果指标 / 哈希</text><rect fill="#FFF4DB" height="156" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="260" x="1040" y="230" /><rect fill="#AD6C18" height="136" rx="2" width="5" x="1040" y="240" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" x="1062" y="262">独立审核</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="1062" y="292">自动校验规则 + Review Agent</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="1062" y="316">可要求人工确认</text><rect fill="#E4F4EF" height="156" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="260" x="1370" y="230" /><rect fill="#188671" height="136" rx="2" width="5" x="1370" y="240" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" x="1392" y="262">可发布交付</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="1392" y="292">固定版本 / 来源记录</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" x="1392" y="316">解锁下游任务</text><path d="M319,302 L367,302" fill="none" marker-end="url(#06_交付物与验收证据_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M649,302 L697,302" fill="none" marker-end="url(#06_交付物与验收证据_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M979,302 L1027,302" fill="none" marker-end="url(#06_交付物与验收证据_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><path d="M1309,302 L1357,302" fill="none" marker-end="url(#06_交付物与验收证据_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><rect fill="#F1F5F9" height="100" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="1450" x="110" y="470" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" x="142" y="513">EvidenceRecord</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="142" y="548">{ taskId, artifactIds, command, exitCode, toolVersion, logPath, sha256, metrics, reviewer, decision }</text><path d="M840 387 V464" fill="none" marker-end="url(#06_交付物与验收证据_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" /><rect fill="#FDEDEE" height="109" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="1020" x="330" y="648" /><rect fill="#B74D53" height="89" rx="2" width="5" x="330" y="658" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="840.0" y="680">上游变更 → 下游受影响任务标记为“需要重新验证”</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="840.0" y="710">根据输入 Artifact 的版本及哈希追踪影响范围；旧结果保留，但不能继续作为新版本的有效证据。</text><path d="M1500 387 V605 H840 V642" fill="none" marker-end="url(#06_交付物与验收证据_svg_red)" opacity="1" stroke="#B74D53" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /></svg>