<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1200" viewBox="0 0 1760 1200" role="img" aria-labelledby="title description">
  <title id="title">图 5  交付物、验收证据与版本变更</title>
  <desc id="description">正常交付与输入变更是两类不同事件；旧证据保留，但不自动证明新版本仍然有效。</desc>
  <g id="background">
    <rect x="0" y="0" width="1760" height="1200" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="128" x2="1712" y2="128" stroke="#E2E9EF" stroke-width="1.5" />
    <rect x="48" y="526" width="440" height="84" rx="10" fill="#FFF5E3" stroke="none" stroke-width="1.4" />
    <rect x="1272" y="526" width="440" height="84" rx="10" fill="#FFF5E3" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="1120" x2="1712" y2="1120" stroke="#E2E9EF" stroke-width="1.3" />
  </g>
  <g id="nodes">
    <g id="input">
      <title>任务输入契约；Spec 与输入版本；验收标准与修改范围</title>
      <rect x="48" y="244" width="288" height="154" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="49" y="261" width="4" height="120" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="execute">
      <title>真实工具执行；隔离工作区与授权；采集源码、命令、日志</title>
      <rect x="392" y="244" width="288" height="154" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="393" y="261" width="4" height="120" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="evidence">
      <title>证据登记；退出码 / 工具版本；产物哈希 / 检查结果</title>
      <rect x="736" y="244" width="288" height="154" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="737" y="261" width="4" height="120" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="review">
      <title>独立验收；自动检查 + Review；必要时等待人工</title>
      <rect x="1080" y="244" width="288" height="154" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1081" y="261" width="4" height="120" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="release">
      <title>接受并发布；保存固定产物版本；释放下游依赖</title>
      <rect x="1424" y="244" width="288" height="154" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1425" y="261" width="4" height="120" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="record">
      <title>EvidenceRecord（记录内容展开）；taskId · attemptId · artifactId · inputVersion；command · cwd · exitCode · toolVersion · logHash；checks[] · reviewer · decision · timestamps</title>
      <rect x="556" y="508" width="648" height="174" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="557" y="525" width="4" height="140" rx="2" fill="#64778A" stroke="none" />
    </g>
    <g id="change">
      <title>输入 Artifact 改变；版本或内容哈希变化</title>
      <rect x="48" y="876" width="330" height="126" rx="12" fill="#FCEDF0" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="49" y="893" width="4" height="92" rx="2" fill="#A54350" stroke="none" />
    </g>
    <g id="impact">
      <title>查找受影响任务；沿已登记的输入依赖追踪</title>
      <rect x="492" y="876" width="330" height="126" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="493" y="893" width="4" height="92" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="revalidate">
      <title>生成重新验证计划；旧结果标记为非当前有效</title>
      <rect x="936" y="876" width="330" height="126" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="937" y="893" width="4" height="92" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="new_decision">
      <title>形成新版验收记录；实际重新执行并独立验收</title>
      <rect x="1380" y="876" width="332" height="126" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1381" y="893" width="4" height="92" rx="2" fill="#197767" stroke="none" />
    </g>
  </g>
  <g id="connections">
    <g id="e01" data-source="input" data-target="execute">
      <title>任务输入契约 → 真实工具执行</title>
      <polyline points="336,321 380,321" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="392,321 380,326.5 380,315.5" fill="#28649B" />
    </g>
    <g id="e02" data-source="execute" data-target="evidence">
      <title>真实工具执行 → 证据登记</title>
      <polyline points="680,321 724,321" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="736,321 724,326.5 724,315.5" fill="#28649B" />
    </g>
    <g id="e03" data-source="evidence" data-target="review">
      <title>证据登记 → 独立验收</title>
      <polyline points="1024,321 1068,321" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1080,321 1068,326.5 1068,315.5" fill="#28649B" />
    </g>
    <g id="e04" data-source="review" data-target="release">
      <title>独立验收 → 接受并发布</title>
      <polyline points="1368,321 1412,321" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1424,321 1412,326.5 1412,315.5" fill="#197767" />
    </g>
    <g id="e05" data-source="evidence" data-target="record">
      <title>展示证据记录字段，不增加执行步骤</title>
      <polyline points="880,398 880,508" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
    </g>
    <g id="e06" data-source="change" data-target="impact">
      <title>change → impact</title>
      <polyline points="378,939 480,939" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="492,939 480,944.5 480,933.5" fill="#9B6419" />
    </g>
    <g id="e07" data-source="impact" data-target="revalidate">
      <title>impact → revalidate</title>
      <polyline points="822,939 924,939" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="936,939 924,944.5 924,933.5" fill="#9B6419" />
    </g>
    <g id="e08" data-source="revalidate" data-target="new_decision">
      <title>revalidate → new_decision</title>
      <polyline points="1266,939 1368,939" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1380,939 1368,944.5 1368,933.5" fill="#9B6419" />
    </g>
  </g>
  <g id="labels" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="48" y="64" font-size="25" fill="#28649B" font-weight="700" text-anchor="start">05</text>
    <text x="112" y="64" font-size="34" fill="#18324B" font-weight="700" text-anchor="start">交付物、验收证据与版本变更</text>
    <text x="48" y="105" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">正常交付与输入变更是两类不同事件；旧证据保留，但不自动证明新版本仍然有效。</text>
    <text x="48" y="184" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">A  正常交付与独立验收</text>
    <text x="70" y="280" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">任务输入契约</text>
    <text x="70" y="311" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">Spec 与输入版本</text>
    <text x="70" y="338" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">验收标准与修改范围</text>
    <text x="414" y="280" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">真实工具执行</text>
    <text x="414" y="311" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">隔离工作区与授权</text>
    <text x="414" y="338" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">采集源码、命令、日志</text>
    <text x="758" y="280" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">证据登记</text>
    <text x="758" y="311" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">退出码 / 工具版本</text>
    <text x="758" y="338" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">产物哈希 / 检查结果</text>
    <text x="1102" y="280" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">独立验收</text>
    <text x="1102" y="311" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">自动检查 + Review</text>
    <text x="1102" y="338" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">必要时等待人工</text>
    <text x="1446" y="280" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">接受并发布</text>
    <text x="1446" y="311" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">保存固定产物版本</text>
    <text x="1446" y="338" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">释放下游依赖</text>
    <text x="880.0" y="544" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">EvidenceRecord（记录内容展开）</text>
    <text x="880.0" y="575" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">taskId · attemptId · artifactId · inputVersion</text>
    <text x="880.0" y="602" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">command · cwd · exitCode · toolVersion · logHash</text>
    <text x="880.0" y="629" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">checks[] · reviewer · decision · timestamps</text>
    <text x="902" y="462" font-size="18" fill="#64778A" font-weight="400" text-anchor="start">字段展开</text>
    <text x="68" y="556" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">缺失记录应标为 missing / unknown。</text>
    <text x="68" y="584" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">不得由模型编造工具版本、日志或哈希。</text>
    <text x="1292" y="556" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">退出码为 0 ≠ 工程验收通过。</text>
    <text x="1292" y="584" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">拒绝时生成 Issue，按有界返工处理。</text>
    <text x="48" y="782" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">B  输入版本发生变化时</text>
    <text x="48" y="818" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">这是独立的变更事件，不是“每次交付完成后必须执行”的步骤。</text>
    <text x="70" y="912" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">输入 Artifact 改变</text>
    <text x="70" y="943" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">版本或内容哈希变化</text>
    <text x="514" y="912" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">查找受影响任务</text>
    <text x="514" y="943" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">沿已登记的输入依赖追踪</text>
    <text x="958" y="912" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">生成重新验证计划</text>
    <text x="958" y="943" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">旧结果标记为非当前有效</text>
    <text x="1402" y="912" font-size="22" fill="#18324B" font-weight="700" text-anchor="start">形成新版验收记录</text>
    <text x="1402" y="943" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">实际重新执行并独立验收</text>
    <text x="48" y="1146" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">实线：产物与验收流转。无箭头虚线：记录内容展开。历史证据保留，新版本需要独立的有效性判断。</text>
  </g>
</svg>