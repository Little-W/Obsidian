  <title id="title">图 7  RV32IMAC SoC：软硬件团队工作流</title>
  <desc id="description">CPU、RAM、UART 与裸机软件在冻结接口后并行开发；最终以真实 RTL 仿真运行 C 程序为验收依据。</desc>
