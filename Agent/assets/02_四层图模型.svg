<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
  <title id="title">图 2  四种图视图与统一标识</title>
  <desc id="description">团队授权、流程控制、任务依赖、运行事实分别展示；视图之间的引用不代表执行先后。</desc>
  <g id="background">
    <rect x="0" y="0" width="1600" height="1060" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="128" x2="1552" y2="128" stroke="#E2E9EF" stroke-width="1.5" />
    <rect x="48" y="168" width="710" height="316" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="842" y="168" width="710" height="316" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="48" y="634" width="710" height="316" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="842" y="634" width="710" height="316" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <line x1="48" y1="980" x2="1552" y2="980" stroke="#E2E9EF" stroke-width="1.3" />
  </g>
  <g id="nodes">
    <g id="leader">
      <title>Leader</title>
      <rect x="88" y="306" width="190" height="80" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="89" y="323" width="4" height="46" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="rtl_role">
      <title>RTL 角色</title>
      <rect x="470" y="274" width="240" height="78" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="471" y="291" width="4" height="44" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="dv_role">
      <title>验证角色</title>
      <rect x="470" y="392" width="240" height="68" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="471" y="409" width="4" height="34" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="start">
      <title>阶段 A</title>
      <rect x="878" y="325" width="168" height="82" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="879" y="342" width="4" height="48" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="step">
      <title>阶段 B</title>
      <rect x="1113" y="325" width="168" height="82" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1114" y="342" width="4" height="48" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="gate">
      <title>验收 Gate</title>
      <rect x="1348" y="325" width="168" height="82" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1349" y="342" width="4" height="48" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="contract">
      <title>接口契约</title>
      <rect x="88" y="773" width="190" height="80" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="89" y="790" width="4" height="46" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="rtl_task">
      <title>CPU RTL 任务</title>
      <rect x="470" y="741" width="240" height="78" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="471" y="758" width="4" height="44" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="sw_task">
      <title>软件启动任务</title>
      <rect x="470" y="859" width="240" height="68" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="471" y="876" width="4" height="34" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="run">
      <title>任务开始</title>
      <rect x="878" y="791" width="168" height="82" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="879" y="808" width="4" height="48" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="tool">
      <title>工具返回</title>
      <rect x="1113" y="791" width="168" height="82" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1114" y="808" width="4" height="48" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="decision">
      <title>验收事件</title>
      <rect x="1348" y="791" width="168" height="82" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1349" y="808" width="4" height="48" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="identities">
      <title>Project · WorkflowVersion · TeamInstance · TaskId · ThreadId / RunId · ArtifactId</title>
      <rect x="48" y="534" width="1504" height="50" rx="12" fill="#F3F6F9" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="49" y="551" width="4" height="16" rx="2" fill="#64778A" stroke="none" />
    </g>
  </g>
  <g id="connections">
    <g id="e01" data-source="leader" data-target="rtl_role">
      <title>授权 Leader 向 RTL 角色分配任务</title>
      <polyline points="278,330 372,330 372,313 458,313" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="470,313 458,318.5 458,307.5" fill="#28649B" />
    </g>
    <g id="e02" data-source="leader" data-target="dv_role">
      <title>授权 Leader 向验证角色分配任务</title>
      <polyline points="278,370 344,370 344,426 458,426" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="470,426 458,431.5 458,420.5" fill="#28649B" />
    </g>
    <g id="e03" data-source="start" data-target="step">
      <title>阶段 A 完成后进入阶段 B</title>
      <polyline points="1046,366 1101,366" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1113,366 1101,371.5 1101,360.5" fill="#28649B" />
    </g>
    <g id="e04" data-source="step" data-target="gate">
      <title>阶段 B 提交后进入独立验收</title>
      <polyline points="1281,366 1336,366" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1348,366 1336,371.5 1336,360.5" fill="#28649B" />
    </g>
    <g id="e05" data-source="contract" data-target="rtl_task">
      <title>CPU RTL 任务依赖接口契约</title>
      <polyline points="278,797 372,797 372,780 458,780" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="470,780 458,785.5 458,774.5" fill="#28649B" />
    </g>
    <g id="e06" data-source="contract" data-target="sw_task">
      <title>软件启动任务依赖接口契约</title>
      <polyline points="278,837 344,837 344,893 458,893" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="470,893 458,898.5 458,887.5" fill="#28649B" />
    </g>
    <g id="e07" data-source="run" data-target="tool">
      <title>事件记录显示工具运行已结束</title>
      <polyline points="1046,832 1101,832" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1113,832 1101,837.5 1101,826.5" fill="#64778A" />
    </g>
    <g id="e08" data-source="tool" data-target="decision">
      <title>后续出现独立验收事件</title>
      <polyline points="1281,832 1336,832" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1348,832 1336,837.5 1336,826.5" fill="#64778A" />
    </g>
    <g id="e09" data-source="team_panel" data-target="identities">
      <title>通过稳定标识引用，无执行方向</title>
      <polyline points="403,484 403,534" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
    </g>
    <g id="e10" data-source="flow_panel" data-target="identities">
      <title>通过稳定标识引用，无执行方向</title>
      <polyline points="1197,484 1197,534" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
    </g>
    <g id="e11" data-source="identities" data-target="task_panel">
      <title>通过稳定标识引用，无执行方向</title>
      <polyline points="403,584 403,634" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
    </g>
    <g id="e12" data-source="identities" data-target="run_panel">
      <title>通过稳定标识引用，无执行方向</title>
      <polyline points="1197,584 1197,634" fill="none" stroke="#64778A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
    </g>
  </g>
  <g id="labels" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="48" y="64" font-size="25" fill="#28649B" font-weight="700" text-anchor="start">02</text>
    <text x="112" y="64" font-size="34" fill="#18324B" font-weight="700" text-anchor="start">四种图视图与统一标识</text>
    <text x="48" y="105" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">团队授权、流程控制、任务依赖、运行事实分别展示；视图之间的引用不代表执行先后。</text>
    <text x="72" y="206" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">角色协作图</text>
    <text x="72" y="238" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">定义谁可以委派、提交、反馈；不直接启动任务。</text>
    <text x="866" y="206" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">流程定义图</text>
    <text x="866" y="238" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">定义步骤、分支、并行、验收和退出规则。</text>
    <text x="72" y="672" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">任务依赖图</text>
    <text x="72" y="704" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">具体交付任务的前置关系；依赖子图保持 DAG。</text>
    <text x="866" y="672" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">运行执行图</text>
    <text x="866" y="704" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">从真实运行事件生成只读视图，不再编辑控制规则。</text>
    <text x="183.0" y="337" font-size="22" fill="#18324B" font-weight="700" text-anchor="middle">Leader</text>
    <text x="590.0" y="305" font-size="22" fill="#18324B" font-weight="700" text-anchor="middle">RTL 角色</text>
    <text x="590.0" y="423" font-size="22" fill="#18324B" font-weight="700" text-anchor="middle">验证角色</text>
    <text x="393" y="300" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">委派</text>
    <text x="393" y="411" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">委派</text>
    <text x="962.0" y="356" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">阶段 A</text>
    <text x="1197.0" y="356" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">阶段 B</text>
    <text x="1432.0" y="356" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">验收 Gate</text>
    <text x="1197" y="453" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">箭头 = 允许的控制转移</text>
    <text x="183.0" y="804" font-size="22" fill="#18324B" font-weight="700" text-anchor="middle">接口契约</text>
    <text x="590.0" y="772" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">CPU RTL 任务</text>
    <text x="590.0" y="890" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">软件启动任务</text>
    <text x="393" y="765" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">依赖</text>
    <text x="393" y="878" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle">依赖</text>
    <text x="962.0" y="822" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">任务开始</text>
    <text x="1197.0" y="822" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">工具返回</text>
    <text x="1432.0" y="822" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">验收事件</text>
    <text x="1197" y="919" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">箭头 = 已发生事件的先后</text>
    <text x="800.0" y="565" font-size="20" fill="#18324B" font-weight="700" text-anchor="middle">Project · WorkflowVersion · TeamInstance · TaskId · ThreadId / RunId · ArtifactId</text>
    <text x="48" y="1006" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">框内箭头按各自视图解释；连接标识条的虚线无箭头，只表示对象引用，不能编译为 Workflow 控制边。</text>
  </g>
</svg>