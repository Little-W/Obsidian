<svg baseProfile="full" height="800px" version="1.1" viewBox="0 0 1650 800" width="1650px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="02_四层图模型_svg_gray" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#8AA0B1" /></marker><marker id="02_四层图模型_svg_blue" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2365A2" /></marker><marker id="02_四层图模型_svg_teal" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#188671" /></marker><marker id="02_四层图模型_svg_amber" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#AD6C18" /></marker><marker id="02_四层图模型_svg_red" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#B74D53" /></marker></defs><rect fill="#FFFFFF" height="800" width="1650" x="0" y="0" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="bold" x="40" y="51">图 2  四种图模型及其关联</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" x="42" y="86">角色关系、流程定义、任务依赖和运行视图有不同的含义；以统一标识关联，不将所有边解释为控制流。</text><line stroke="#E2E8F0" stroke-width="1.5" x1="40" x2="1610" y1="105" y2="105" /><rect fill="#EAF3FC" height="150" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="334" x="40" y="168" /><rect fill="#2365A2" height="130" rx="2" width="5" x="40" y="178" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="207.0" y="200">角色协作图</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="207.0" y="230">谁有权做什么</text><rect fill="#EAF3FC" height="180" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="40" y="350" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="64" y="392">• 角色模板 · 角色实例</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="64" y="435">• 分配 / 汇报 / 反馈</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="64" y="478">• 授权关系，不直接执行</text><rect fill="#F1F5F9" height="90" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="40" y="570" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="207" y="606">可复用团队模板</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="207" y="633">通过稳定 ID 对应</text><rect fill="#E4F4EF" height="150" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="334" x="452" y="168" /><rect fill="#188671" height="130" rx="2" width="5" x="452" y="178" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="619.0" y="200">Workflow 图</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="619.0" y="230">何时执行什么</text><rect fill="#E4F4EF" height="180" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="452" y="350" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="476" y="392">• 步骤 / 条件 / 并行</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="476" y="435">• 子图 / Gate / 退出</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="476" y="478">• 可编译的控制规则</text><rect fill="#F1F5F9" height="90" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="452" y="570" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="619" y="606">不可变发布版本</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="619" y="633">通过稳定 ID 对应</text><rect fill="#FFF4DB" height="150" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="334" x="864" y="168" /><rect fill="#AD6C18" height="130" rx="2" width="5" x="864" y="178" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="1031.0" y="200">任务依赖图</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="1031.0" y="230">具体交付如何分工</text><rect fill="#FFF4DB" height="180" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="864" y="350" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="888" y="392">• 任务实例 · 模块实例</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="888" y="435">• 前置条件 / 产物依赖</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="888" y="478">• 动态展开后可并行</text><rect fill="#F1F5F9" height="90" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="864" y="570" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1031" y="606">受控任务计划版本</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1031" y="633">通过稳定 ID 对应</text><rect fill="#F1F5F9" height="150" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="334" x="1276" y="168" /><rect fill="#8AA0B1" height="130" rx="2" width="5" x="1276" y="178" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="1443.0" y="200">运行执行图</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="1443.0" y="230">实际发生了什么</text><rect fill="#F1F5F9" height="180" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="1276" y="350" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="1300" y="392">• Thread / Run / NodeRun</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="1300" y="435">• 状态 / 事件 / 审批</text><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="normal" x="1300" y="478">• 可回放、可追溯</text><rect fill="#F1F5F9" height="90" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="334" x="1276" y="570" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1443" y="606">事件记录与检查点</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1443" y="633">通过稳定 ID 对应</text><path d="M389,424 L432,424" fill="none" marker-end="url(#02_四层图模型_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#2365A2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="409" y="405">关联</text><path d="M801,424 L844,424" fill="none" marker-end="url(#02_四层图模型_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#2365A2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="821" y="405">关联</text><path d="M1213,424 L1256,424" fill="none" marker-end="url(#02_四层图模型_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#2365A2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="1233" y="405">关联</text><rect fill="#EAF3FC" height="63" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="1205" x="223" y="702" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="825" y="743">统一上下文：Project → WorkflowVersion → TeamInstance → TaskInstance → Thread / Run / Event / Artifact</text></svg>