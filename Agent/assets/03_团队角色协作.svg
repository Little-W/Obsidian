<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="title description">
  <title id="title">图 3  团队角色与交付协作</title>
  <desc id="description">左侧定义授权，右侧展示一次任务交付；独立验收通过后，调度器才释放下游依赖。</desc>
  <g id="background">
    <rect x="0" y="0" width="1600" height="1090" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="128" x2="1552" y2="128" stroke="#E2E9EF" stroke-width="1.5" />
    <rect x="48" y="168" width="560" height="812" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="652" y="168" width="900" height="812" rx="12" fill="#FFFFFF" stroke="#CED9E3" stroke-width="1.4" />
    <rect x="80" y="693" width="496" height="112" rx="10" fill="#F3F6F9" stroke="none" stroke-width="1.4" />
    <rect x="80" y="837" width="496" height="84" rx="10" fill="#EEF5FC" stroke="none" stroke-width="1.4" />
    <line x1="48" y1="1010" x2="1552" y2="1010" stroke="#E2E9EF" stroke-width="1.3" />
  </g>
  <g id="nodes">
    <g id="leader">
      <title>Leader / Supervisor；任务规划 · 委派 · 升级</title>
      <rect x="180" y="294" width="300" height="110" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="181" y="311" width="4" height="76" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="worker_role">
      <title>专业执行角色；RTL / 软件 / EDA</title>
      <rect x="80" y="520" width="222" height="112" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="81" y="537" width="4" height="78" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="review_role">
      <title>独立验证角色；验证 / 审核 / Gate</title>
      <rect x="354" y="520" width="222" height="112" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="355" y="537" width="4" height="78" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="scheduler">
      <title>Task Scheduler；依赖满足后派工</title>
      <rect x="700" y="294" width="304" height="110" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="701" y="311" width="4" height="76" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="member">
      <title>专业 Agent；按任务契约执行</title>
      <rect x="1200" y="294" width="304" height="110" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1201" y="311" width="4" height="76" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="reviewer_gate">
      <title>独立验收 Gate；真实证据 + 审核规则；通过 / 返工 / 阻塞</title>
      <rect x="1200" y="574" width="304" height="126" rx="12" fill="#FFF5E3" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1201" y="591" width="4" height="92" rx="2" fill="#9B6419" stroke="none" />
    </g>
    <g id="accepted">
      <title>登记 Accepted；固定产物版本；保留验收记录</title>
      <rect x="700" y="574" width="304" height="126" rx="12" fill="#EAF6F1" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="701" y="591" width="4" height="92" rx="2" fill="#197767" stroke="none" />
    </g>
    <g id="next_task">
      <title>下游任务进入 Ready；再检查权限与资源</title>
      <rect x="700" y="824" width="304" height="110" rx="12" fill="#EEF5FC" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="701" y="841" width="4" height="76" rx="2" fill="#28649B" stroke="none" />
    </g>
    <g id="blocked">
      <title>阻塞并升级处理；证据不足或预算耗尽</title>
      <rect x="1200" y="824" width="304" height="110" rx="12" fill="#FCEDF0" stroke="#CED9E3" stroke-width="1.5" />
      <rect x="1201" y="841" width="4" height="76" rx="2" fill="#A54350" stroke="none" />
    </g>
  </g>
  <g id="connections">
    <g id="e01" data-source="leader" data-target="worker_role">
      <title>Leader 被授权向专业执行角色派工</title>
      <polyline points="255,404 255,458 191,458 191,508" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="191,520 185.5,508 196.5,508" fill="#28649B" />
    </g>
    <g id="e02" data-source="leader" data-target="review_role">
      <title>Leader 被授权向独立验证角色派工</title>
      <polyline points="405,404 405,458 465,458 465,508" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="465,520 459.5,508 470.5,508" fill="#28649B" />
    </g>
    <g id="e03" data-source="scheduler" data-target="member">
      <title>1. 调度器派发满足依赖的任务</title>
      <polyline points="1004,349 1188,349" fill="none" stroke="#28649B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1200,349 1188,354.5 1188,343.5" fill="#28649B" />
    </g>
    <g id="e04" data-source="member" data-target="reviewer_gate">
      <title>2. 提交产物与真实工具证据</title>
      <polyline points="1306.4,404 1306.4,562" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1306.4,574 1300.9,562 1311.9,562" fill="#197767" />
    </g>
    <g id="e05" data-source="reviewer_gate" data-target="member">
      <title>可修复且预算允许时退回同一任务执行者</title>
      <polyline points="1443.2,574 1443.2,416" fill="none" stroke="#9B6419" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
      <polygon points="1443.2,404 1448.7,416 1437.7,416" fill="#9B6419" />
    </g>
    <g id="e06" data-source="reviewer_gate" data-target="accepted">
      <title>3. 验收通过后登记任务接受状态</title>
      <polyline points="1200,626.92 1016,626.92" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1004,626.92 1016,621.42 1016,632.42" fill="#197767" />
    </g>
    <g id="e07" data-source="accepted" data-target="next_task">
      <title>4. 已验收任务释放下游依赖</title>
      <polyline points="852,700 852,812" fill="none" stroke="#197767" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="852,824 846.5,812 857.5,812" fill="#197767" />
    </g>
    <g id="e08" data-source="reviewer_gate" data-target="blocked">
      <title>无法自动修复时阻塞并通知 Leader 或人工</title>
      <polyline points="1352,700 1352,812" fill="none" stroke="#A54350" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="1352,824 1346.5,812 1357.5,812" fill="#A54350" />
    </g>
  </g>
  <g id="labels" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="48" y="64" font-size="25" fill="#28649B" font-weight="700" text-anchor="start">03</text>
    <text x="112" y="64" font-size="34" fill="#18324B" font-weight="700" text-anchor="start">团队角色与交付协作</text>
    <text x="48" y="105" font-size="19" fill="#52677C" font-weight="400" text-anchor="start">左侧定义授权，右侧展示一次任务交付；独立验收通过后，调度器才释放下游依赖。</text>
    <text x="72" y="206" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">A  角色授权</text>
    <text x="72" y="238" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">模板规定职责与权限，不表示固定执行次序。</text>
    <text x="676" y="206" font-size="24" fill="#18324B" font-weight="700" text-anchor="start">B  一次任务的交付协议</text>
    <text x="676" y="238" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">派工、交付、验收、返工各有明确方向。</text>
    <text x="330.0" y="330" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">Leader / Supervisor</text>
    <text x="330.0" y="361" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">任务规划 · 委派 · 升级</text>
    <text x="191.0" y="556" font-size="22" fill="#18324B" font-weight="700" text-anchor="middle">专业执行角色</text>
    <text x="191.0" y="587" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">RTL / 软件 / EDA</text>
    <text x="465.0" y="556" font-size="22" fill="#18324B" font-weight="700" text-anchor="middle">独立验证角色</text>
    <text x="465.0" y="587" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">验证 / 审核 / Gate</text>
    <text x="328" y="493" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">委派权限</text>
    <text x="100" y="723" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">每个角色可生成多个独立成员实例。</text>
    <text x="100" y="751" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">关键验收不由同一执行者自我批准。</text>
    <text x="100" y="779" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">文件范围、工具授权、预算由运行时强制检查。</text>
    <text x="100" y="867" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">协作消息本身不解锁任务。</text>
    <text x="100" y="895" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">是否可执行仍由流程、依赖与资源决定。</text>
    <text x="852.0" y="330" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">Task Scheduler</text>
    <text x="852.0" y="361" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">依赖满足后派工</text>
    <text x="1352.0" y="330" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">专业 Agent</text>
    <text x="1352.0" y="361" font-size="19" fill="#52677C" font-weight="400" text-anchor="middle">按任务契约执行</text>
    <text x="1352.0" y="610" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">独立验收 Gate</text>
    <text x="1352.0" y="641" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">真实证据 + 审核规则</text>
    <text x="1352.0" y="668" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">通过 / 返工 / 阻塞</text>
    <text x="852.0" y="610" font-size="23" fill="#18324B" font-weight="700" text-anchor="middle">登记 Accepted</text>
    <text x="852.0" y="641" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">固定产物版本</text>
    <text x="852.0" y="668" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">保留验收记录</text>
    <text x="852.0" y="860" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">下游任务进入 Ready</text>
    <text x="852.0" y="891" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">再检查权限与资源</text>
    <text x="1352.0" y="860" font-size="21" fill="#18324B" font-weight="700" text-anchor="middle">阻塞并升级处理</text>
    <text x="1352.0" y="891" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">证据不足或预算耗尽</text>
    <text x="1102" y="334" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle">1  派工</text>
    <text x="1325" y="479" font-size="18" fill="#197767" font-weight="400" text-anchor="start">2  交付</text>
    <text x="1460" y="533" font-size="18" fill="#9B6419" font-weight="400" text-anchor="start">返工</text>
    <text x="1102" y="612" font-size="18" fill="#197767" font-weight="400" text-anchor="middle">3  验收通过</text>
    <text x="872" y="770" font-size="18" fill="#197767" font-weight="400" text-anchor="start">4  释放依赖</text>
    <text x="1374" y="770" font-size="18" fill="#A54350" font-weight="400" text-anchor="start">不可自动修复</text>
    <text x="48" y="1036" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">蓝线：授权或派工（以面板标题为准）。绿线：交付与通过。橙色虚线：有界返工。红线：阻塞升级。</text>
  </g>
</svg>