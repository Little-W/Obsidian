<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="860px" version="1.1" viewBox="0 0 1690 860" width="1690px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="03_团队角色协作_svg_gray" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#8AA0B1" /></marker><marker id="03_团队角色协作_svg_blue" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2365A2" /></marker><marker id="03_团队角色协作_svg_teal" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#188671" /></marker><marker id="03_团队角色协作_svg_amber" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#AD6C18" /></marker><marker id="03_团队角色协作_svg_red" markerHeight="8" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#B74D53" /></marker></defs><rect fill="#FFFFFF" height="860" width="1690" x="0" y="0" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="bold" x="40" y="51">图 3  团队角色及协作授权</text><text fill="#64748B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" x="42" y="86">Leader 调度专业角色；交付、退回与验收明确区分。角色数量可按工作量扩展为多个执行实例。</text><line stroke="#E2E8F0" stroke-width="1.5" x1="40" x2="1650" y1="105" y2="105" /><rect fill="#EAF3FC" height="118" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="360" x="665" y="145" /><rect fill="#2365A2" height="98" rx="2" width="5" x="665" y="155" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="845.0" y="177">Leader / Supervisor</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="845.0" y="207">需求分解 · 派工 · 冲突协调</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="845.0" y="231">进度监督 · 升级处理</text><path d="M845 263 V327 H1505" fill="none" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M845 327 H175" fill="none" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M175,327 L175,388" fill="none" marker-end="url(#03_团队角色协作_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#E4F4EF" height="130" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="250" x="50" y="395" /><rect fill="#188671" height="110" rx="2" width="5" x="50" y="405" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="175.0" y="427">Architect</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="175.0" y="457">规格与模块契约</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="175.0" y="481">行为模型、设计评审</text><path d="M510,327 L510,388" fill="none" marker-end="url(#03_团队角色协作_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#E4F4EF" height="130" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="250" x="385" y="395" /><rect fill="#188671" height="110" rx="2" width="5" x="385" y="405" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="510.0" y="427">RTL Engineer ×N</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="510.0" y="457">模块 RTL 与单元测试</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="510.0" y="481">模块工作区独占写入</text><path d="M845,327 L845,388" fill="none" marker-end="url(#03_团队角色协作_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#E4F4EF" height="130" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="250" x="720" y="395" /><rect fill="#188671" height="110" rx="2" width="5" x="720" y="405" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="845.0" y="427">Verification ×M</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="845.0" y="457">独立测试与问题定位</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="845.0" y="481">提交验收证据</text><path d="M1180,327 L1180,388" fill="none" marker-end="url(#03_团队角色协作_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#E4F4EF" height="130" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="250" x="1055" y="395" /><rect fill="#188671" height="110" rx="2" width="5" x="1055" y="405" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="1180.0" y="427">Integration</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1180.0" y="457">SoC 集成与软件运行</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1180.0" y="481">接口、时钟、外设验证</text><path d="M1515,327 L1515,388" fill="none" marker-end="url(#03_团队角色协作_svg_blue)" opacity="1" stroke="#2365A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#E4F4EF" height="130" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="250" x="1390" y="395" /><rect fill="#188671" height="110" rx="2" width="5" x="1390" y="405" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="1515.0" y="427">EDA / DFT</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1515.0" y="457">综合、扫描、ATPG</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1515.0" y="481">工具运行和报告</text><text fill="#2365A2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="1060" y="304">任务派发（带范围、交付与预算）</text><path d="M635 455 H713" fill="none" marker-end="url(#03_团队角色协作_svg_teal)" opacity="1" stroke="#188671" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#188671" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="673" y="439">交付</text><path d="M720 505 H640 V555 H560 V531" fill="none" marker-end="url(#03_团队角色协作_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#AD6C18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="632" y="567">缺陷反馈 / 返工</text><rect fill="#FFF4DB" height="105" rx="12" stroke="#CCD9E5" stroke-width="1.3" width="760" x="465" y="632" /><rect fill="#AD6C18" height="85" rx="2" width="5" x="465" y="642" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="845.0" y="664">独立验收节点（Gate）</text><text fill="#34435A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="845.0" y="694">检查交付物 → 运行真实工具 → 核对证据 → 通过 / 拒绝 / 人工审批</text><path d="M845 525 V625" fill="none" marker-end="url(#03_团队角色协作_svg_amber)" opacity="1" stroke="#AD6C18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" /><rect fill="#F1F5F9" height="47" rx="10" stroke="#D9E1EC" stroke-width="1.2" width="1300" x="195" y="784" /><text fill="#152B43" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="845" y="814">团队通信边只传任务和报告；是否解锁后续任务，由 Scheduler 按验收状态及依赖规则决定。</text></svg>