    <text x="807" y="953" font-size="18" fill="#9B6419" font-weight="400" text-anchor="start">登记产物与工具证据</text>
    <text x="48" y="1156" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">实线：按标注方向发起调用或返回结果。虚线：可选观测事件。持久化框表示逻辑能力，不要求使用同一张表。</text>
  </g>
</svg>