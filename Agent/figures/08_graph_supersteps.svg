   <g id="text_1">
    <text style="font-size: 27px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #183047" x="46.8" y="53.111953" transform="rotate(-0 46.8 53.111953)">Pregel：本阶段写入在下一阶段才可见</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #556a7c" x="46.8" y="88.230937" transform="rotate(-0 46.8 88.230937)">并行节点读取阶段开始的状态；阶段结束后，reducer 合并各节点返回的更新。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 23px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #2864b4" x="68.4" y="168.739531" transform="rotate(-0 68.4 168.739531)">super-step k</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'Droid Sans Fallback'; text-anchor: end; fill: #556a7c" x="1080" y="167.169219" transform="rotate(-0 1080 167.169219)">纯诊断示例：两个节点都只产生结果数据</text>
   </g>
   <g id="text_5">
    <text style="font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2864b4" x="180" y="306.429813" transform="rotate(-0 180 306.429813)">已提交状态 S(k)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="180" y="348.006937" transform="rotate(-0 180 348.006937)">diagnoses = {}</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2864b4" x="482.4" y="243.069813" transform="rotate(-0 482.4 243.069813)">节点 A</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="482.4" y="271.326937" transform="rotate(-0 482.4 271.326937)">读取同一份 S(k)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2864b4" x="482.4" y="387.069813" transform="rotate(-0 482.4 387.069813)">节点 B</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="482.4" y="415.326937" transform="rotate(-0 482.4 415.326937)">读取同一份 S(k)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 16px; font-family: 'Droid Sans Fallback'; fill: #c97722" transform="translate(433.3375 315.174688)">即使 A 先完成</text>
    <text style="font-size: 16px; font-family: 'Droid Sans Fallback'; fill: #c97722" transform="translate(394.275 335.440313)">B 也看不到 A 本阶段写入</text>
   </g>
   <g id="text_12">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2864b4" x="770.4" y="253.110937" transform="rotate(-0 770.4 253.110937)">{A: 诊断 A}</text>
   </g>
   <g id="text_13">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2864b4" x="770.4" y="397.110937" transform="rotate(-0 770.4 397.110937)">{B: 诊断 B}</text>
   </g>
   <g id="text_14">
    <text style="font-size: 16px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="640.8" y="230.2675" transform="rotate(-0 640.8 230.2675)">返回更新</text>
   </g>
   <g id="text_15">
    <text style="font-size: 16px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="640.8" y="374.2675" transform="rotate(-0 640.8 374.2675)">返回更新</text>
   </g>
   <g id="text_16">
    <text style="font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #11847b" x="1000.8" y="304.413813" transform="rotate(-0 1000.8 304.413813)">阶段结束</text>
   </g>
   <g id="text_17">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="1000.8" y="351.318937" transform="rotate(-0 1000.8 351.318937)">reducer 按键合并</text>
   </g>
   <g id="text_18">
    <text style="font-size: 23px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #11847b" x="68.4" y="546.019531" transform="rotate(-0 68.4 546.019531)">super-step k+1</text>
   </g>
   <g id="text_19">
    <text style="font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #11847b" x="475.2" y="596.877813" transform="rotate(-0 475.2 596.877813)">已合并状态 S(k+1)</text>
   </g>
   <g id="text_20">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="475.2" y="622.927969" transform="rotate(-0 475.2 622.927969)">diagnoses = {A: 诊断 A, B: 诊断 B}</text>
   </g>
   <g id="text_21">
    <text style="font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #11847b" x="950.4" y="596.877813" transform="rotate(-0 950.4 596.877813)">汇总节点 C</text>
   </g>
   <g id="text_22">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="950.4" y="622.470937" transform="rotate(-0 950.4 622.470937)">读取两个诊断结果</text>
   </g>
   <g id="text_23">
    <text style="font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #556a7c" x="784.8" y="579.925781" transform="rotate(-0 784.8 579.925781)">下一阶段读取</text>
   </g>
   <g id="text_24">
    <text style="font-size: 17px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #556a7c" x="46.8" y="681.249219" transform="rotate(-0 46.8 681.249219)">此例仅合并无副作用的诊断数据；图状态同步不保证外部工具只执行一次。</text>
   </g>
   <g id="text_25">
    <text style="font-size: 14px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #556a7c" x="46.8" y="709.984062" transform="rotate(-0 46.8 709.984062)">设计归纳示意；具体框架行为以正文为准</text>
