  <rect width="2560" height="1840" fill="#ffffff"/>
  <text class="title" x="50" y="55">INT16 DiP：Cycle 1（e1 上升沿后）</text>
  <text class="subtitle" x="50" y="92">每个 PE 同时显示有效的 data_q、product_q、logical_product_q、contribution_o 与 psum_q；A 行连续输入。</text>
  <line x1="50" y1="115" x2="2505" y2="115" stroke="#111111" stroke-width="1.5"/>
  <text class="config" x="50" y="150">ARRAY_N=4　mode_i=2'b00　w=16　lanes=1　L=4</text>
  <text class="config" x="50" y="180">M=16×8-bit　LP=1×INT32　Q/S=1×64 bit　C=4×INT32</text>
  <text class="config" x="50" y="210">Q[R,C,0]=A[m,k]×B[k,C]，k=(R+C) mod 4</text>
  <text class="subtitle" x="50" y="250">蓝色：packed A；灰色：同列部分和；深蓝色：局部贡献、部分和与输出。PE 框显示 e1 后寄存值；箭头显示该上升沿读取的沿前值。</text>

