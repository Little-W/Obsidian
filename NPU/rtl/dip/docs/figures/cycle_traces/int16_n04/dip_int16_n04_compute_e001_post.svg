      .side-title { font: 700 25px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .side-subtitle { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
