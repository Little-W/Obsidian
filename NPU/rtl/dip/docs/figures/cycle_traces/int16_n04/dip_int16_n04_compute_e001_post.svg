  <text class="side-text" x="1830" y="818">五组使能与五组 valid 同形。</text>

  <text class="side-subtitle" x="1830" y="850">本上升沿写入的部分和</text>
  <text class="side-muted" x="1830" y="875">本上升沿没有 psum_q 写入</text>

  <text class="side-subtitle" x="1830" y="1200">输出端口</text>
  <text class="side-text" x="1830" y="1238">c_row_valid_o=0</text>
  <text class="side-text" x="1830" y="1270">输出格式：4×INT32</text>
  <text class="side-text" x="1830" y="1302">每段截取 psum_q 的低 32 bit。</text>
  <text class="side-text" x="1830" y="1334">c_accum_row_o 将有效段符号扩展到 64 bit。</text>

  <text class="side-subtitle" x="1830" y="1385">数值例子</text>
  <text class="side-mono" x="1830" y="1423">A[m,k]=((3m+k) mod 7)-3</text>
  <text class="side-mono" x="1830" y="1453">B[k,j]=((2k+j) mod 5)-2</text>
  <text class="side-text" x="1830" y="1490">A、B 元素均在 INT4 可表示范围内。</text>
  <text class="side-text" x="1830" y="1525">LP、Q、S 和 C 为脚本按 RTL 公式计算的值。</text>


  <text class="note" x="50" y="1740">灰色竖箭头表示本上升沿读取上一物理行保存的 S；读取不会清除源 PE 的 psum_q。</text>
  <text class="note" x="50" y="1770">PE 框内只列出 valid=1 的 D/M/LP/Q/S；Q 是 contribution_o 的触发器输出，不是组合中间值。</text>
  <text class="note" x="50" y="1800">Cycle 7 首次得到完整输出行；默认 ARRAY_N=16 时首行在 e19 上升沿后有效。</text>
  <text class="cycle" x="897" y="1810">Cycle 1</text>
</svg>
