<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">N 等于 2 时 INT8 的 u v 乘法示例</title>
  <desc id="desc">展示物理 PE 零行一列如何使用自己的两个数据 lane 和循环回接的右邻 word 计算两个局部输出。</desc>
  <defs>
    <style>
      .title { font: 700 28px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .h2 { font: 700 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 700 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .left { text-anchor: start; }
      .mono { font: 700 16px "JetBrains Mono", "DejaVu Sans Mono", monospace; fill: #0f172a; }
      .monoc { font: 700 17px "JetBrains Mono", "DejaVu Sans Mono", monospace; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .word0 { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .word1 { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 2; }
      .weight { fill: #ffedd5; stroke: #d97706; stroke-width: 2; }
      .product { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .sum { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 3; }
      .arrow2 { fill: none; stroke: #7c3aed; stroke-width: 3; }
      .guide { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1400" height="790" fill="#ffffff"/>
  <text x="40" y="48" class="title">INT8、物理 N=2：最右侧 PE 的四个 (u,v) 乘法</text>
  <text x="40" y="78" class="small left">lanes=2、L=4；A0 表示 A[m,0]，所有 K 下标均对 4 取余。</text>

  <text x="70" y="126" class="h2 left">一个逻辑 A 行的固定带宽打包</text>
  <g transform="translate(70 145)">
    <rect class="word0" x="0" y="0" width="220" height="78" rx="9"/>
    <line x1="110" y1="0" x2="110" y2="78" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="monoc" x="55" y="39">lane0=A0</text><text class="monoc" x="165" y="39">lane1=A1</text>
    <text class="small" x="110" y="104" text-anchor="middle">physical word C=0</text>

    <rect class="word1" x="270" y="0" width="220" height="78" rx="9"/>
    <line x1="380" y1="0" x2="380" y2="78" stroke="#a5b4fc" stroke-width="1.5"/>
    <text class="monoc" x="325" y="39">lane0=A2</text><text class="monoc" x="435" y="39">lane1=A3</text>
    <text class="small" x="380" y="104" text-anchor="middle">physical word C=1</text>
  </g>

  <text x="315" y="279" class="label" text-anchor="middle">C=1 的右邻按模 2 回到 C=0</text>

  <g transform="translate(70 315)">
    <rect x="0" y="0" width="490" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="32" class="label left">目标：PE(R=0,C=1)</text>
    <rect class="word0" x="20" y="52" width="210" height="65" rx="7"/>
    <line x1="125" y1="52" x2="125" y2="117" stroke="#93c5fd" stroke-width="1.3"/>
    <text class="small" x="72" y="72" text-anchor="middle">right[0]</text><text class="small" x="178" y="72" text-anchor="middle">right[1]</text>
    <text class="monoc" x="72" y="96">A0</text><text class="monoc" x="178" y="96">A1</text>
    <rect class="word1" x="260" y="52" width="210" height="65" rx="7"/>
    <line x1="365" y1="52" x2="365" y2="117" stroke="#a5b4fc" stroke-width="1.3"/>
    <text class="small" x="312" y="72" text-anchor="middle">self[0]</text><text class="small" x="418" y="72" text-anchor="middle">self[1]</text>
    <text class="monoc" x="312" y="96">A2</text><text class="monoc" x="418" y="96">A3</text>
  </g>
  <path class="arrow" d="M70 184H45V399.5H87" marker-end="url(#arrow-blue)"/>
  <path class="arrow" d="M560 184H585V399.5H543" marker-end="url(#arrow-blue)"/>

  <text x="625" y="126" class="h2">PE 内保存的四个 INT8 权重</text>
  <g transform="translate(625 145)">
    <rect class="weight" x="0" y="0" width="300" height="160" rx="10"/>
    <line x1="150" y1="0" x2="150" y2="160" stroke="#fdba74" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#fdba74" stroke-width="1.5"/>
    <text class="small" x="75" y="23" text-anchor="middle">v=0</text><text class="small" x="225" y="23" text-anchor="middle">v=1</text>
    <text class="monoc" x="75" y="54">B[2,2]</text><text class="monoc" x="225" y="54">B[3,3]</text>
    <text class="monoc" x="75" y="126">B[3,2]</text><text class="monoc" x="225" y="126">B[0,3]</text>
    <text class="small" x="-12" y="54" text-anchor="end">u=0</text><text class="small" x="-12" y="126" text-anchor="end">u=1</text>
  </g>

  <text x="1000" y="126" class="h2">四个乘法的数据选择</text>
  <g transform="translate(1000 145)">
    <rect class="product" x="0" y="0" width="330" height="160" rx="10"/>
    <line x1="165" y1="0" x2="165" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="330" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="monoc" x="82" y="40">A2 × B[2,2]</text>
    <text class="monoc" x="247" y="40">A3 × B[3,3]</text>
    <text class="monoc" x="82" y="120">A3 × B[3,2]</text>
    <text class="monoc" x="247" y="120">A0 × B[0,3]</text>
    <text class="small" x="82" y="-10" text-anchor="middle">v=0</text><text class="small" x="247" y="-10" text-anchor="middle">v=1</text>
    <text class="small" x="-12" y="40" text-anchor="end">u=0</text><text class="small" x="-12" y="120" text-anchor="end">u=1</text>
  </g>

  <path class="arrow2" d="M1082 305V397" marker-end="url(#arrow-purple)"/>
  <path class="arrow2" d="M1247 305V397" marker-end="url(#arrow-purple)"/>

  <g transform="translate(865 400)">
    <rect class="sum" x="0" y="0" width="465" height="120" rx="12"/>
    <text x="232" y="34" class="label" text-anchor="middle">沿 u 局部求和，产生两个 32-bit contribution lane</text>
    <text x="232" y="72" class="mono" text-anchor="middle">partial(0,1,0) = A2·B[2,2] + A3·B[3,2]</text>
    <text x="232" y="101" class="mono" text-anchor="middle">partial(0,1,1) = A3·B[3,3] + A0·B[0,3]</text>
  </g>

  <g transform="translate(70 485)">
    <rect x="0" y="0" width="720" height="225" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="25" y="38" class="h2 left">下一物理行补齐其余两个 K 项</text>
    <text x="25" y="78" class="mono" style="text-anchor:start">partial(1,1,0) = A0·B[0,2] + A1·B[1,2]</text>
    <text x="25" y="111" class="mono" style="text-anchor:start">partial(1,1,1) = A1·B[1,3] + A2·B[2,3]</text>
    <line x1="25" y1="135" x2="695" y2="135" stroke="#86efac" stroke-width="1.5"/>
    <text x="25" y="170" class="mono" style="text-anchor:start">C[m,2] = A0·B[0,2] + A1·B[1,2] + A2·B[2,2] + A3·B[3,2]</text>
    <text x="25" y="203" class="mono" style="text-anchor:start">C[m,3] = A0·B[0,3] + A1·B[1,3] + A2·B[2,3] + A3·B[3,3]</text>
  </g>

  <rect x="865" y="565" width="465" height="145" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1097" y="603" class="h2" text-anchor="middle">为什么结果仍是普通 GEMM</text>
  <text x="1097" y="640" class="label" text-anchor="middle">R=0、1 与 u=0、1 的四种组合</text>
  <text x="1097" y="669" class="label" text-anchor="middle">使 k 恰好遍历 0、1、2、3 各一次</text>
</svg>
