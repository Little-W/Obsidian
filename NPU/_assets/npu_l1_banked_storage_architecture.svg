    <tspan x="655.0" y="1187.2">Bank 1</tspan>
    <tspan x="655.0" y="1222.0">64-bit 1R1W</tspan>
    <tspan x="655.0" y="1256.8">32768 word；256 KiB</tspan>
  </text>
  <rect x="880.0" y="1130.0" width="330.0" height="160.0" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" />
  <text x="1045.0" y="1187.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="1045.0" y="1187.2">Bank 2</tspan>
    <tspan x="1045.0" y="1222.0">64-bit 1R1W</tspan>
    <tspan x="1045.0" y="1256.8">32768 word；256 KiB</tspan>
  </text>
  <rect x="1270.0" y="1130.0" width="330.0" height="160.0" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" />
  <text x="1435.0" y="1187.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="1435.0" y="1187.2">Bank 3</tspan>
    <tspan x="1435.0" y="1222.0">64-bit 1R1W</tspan>
    <tspan x="1435.0" y="1256.8">32768 word；256 KiB</tspan>
  </text>
  <text x="850.0" y="1344.0" fill="#475569" font-family="Noto Sans CJK SC" font-size="23.0" font-weight="600" text-anchor="middle">
    <tspan x="850.0" y="1344.0">默认总容量 1 MiB；支持 4 / 8 / 16 bank。宽面板是分段结果，不增加物理 RAM 端口。</tspan>
  </text>
