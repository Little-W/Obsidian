  <text x="52.0" y="55.0" fill="#17324D" font-family="Noto Sans CJK SC" font-size="30.0" font-weight="600" text-anchor="start">
    <tspan x="52.0" y="55.0">整数主干、显式浮点流与结果写回</tspan>
  </text>
  <rect x="70.0" y="160.0" width="320.0" height="180.0" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" />
  <text x="230.0" y="227.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="230.0" y="227.2">整数编码与打包权重</tspan>
    <tspan x="230.0" y="262.0">A8 / W4；其他模式由配置</tspan>
    <tspan x="230.0" y="296.79999999999995">决定</tspan>
  </text>
  <rect x="560.0" y="160.0" width="650.0" height="180.0" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
  <text x="885.0" y="227.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="885.0" y="227.2">Matrix 整数阵列与组缩放</tspan>
    <tspan x="885.0" y="262.0">整数部分和、零点校正、公共指数宽累加</tspan>
    <tspan x="885.0" y="296.79999999999995">整行输出尺度、最终一次 RNE 和饱和</tspan>
  </text>
  <rect x="1450.0" y="160.0" width="280.0" height="180.0" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" />
  <text x="1590.0" y="227.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="1590.0" y="227.2">整数主干输出</tspan>
    <tspan x="1590.0" y="262.0">INT8 / INT16 / INT32</tspan>
    <tspan x="1590.0" y="296.79999999999995">附带明确的数值尺度</tspan>
  </text>
  <rect x="560.0" y="410.0" width="650.0" height="150.0" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" />
  <text x="885.0" y="462.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="885.0" y="462.2">静态参数与动态状态</tspan>
    <tspan x="885.0" y="497.0">权重尺度、zero point 与配置不随 token 重编</tspan>
    <tspan x="885.0" y="531.8">A8 / 输出行统计通过状态区发布</tspan>
  </text>
  <rect x="70.0" y="720.0" width="320.0" height="190.0" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" />
  <text x="230.0" y="774.8" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="230.0" y="774.8">显式浮点位型</tspan>
    <tspan x="230.0" y="809.5999999999999">binary32 使用 INT32 容器</tspan>
    <tspan x="230.0" y="844.4">packed binary16 使用格式</tspan>
    <tspan x="230.0" y="879.1999999999999">标志</tspan>
  </text>
  <rect x="560.0" y="720.0" width="650.0" height="190.0" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
  <text x="885.0" y="774.8" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="885.0" y="774.8">Complex 流与共享 FMA</tspan>
    <tspan x="885.0" y="809.5999999999999">转换、乘加、归约、非线性与统计</tspan>
    <tspan x="885.0" y="844.4">按指令控制 FP16 / FP32；私有行 RAM</tspan>
    <tspan x="885.0" y="879.1999999999999">一个物理字流水，逻辑请求排队</tspan>
  </text>
  <rect x="1450.0" y="720.0" width="280.0" height="190.0" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" />
  <text x="1590.0" y="792.2" fill="#17324D" font-family="Noto Sans CJK SC" font-size="24.0" font-weight="600" text-anchor="middle">
    <tspan x="1590.0" y="792.2">按指令格式写回</tspan>
    <tspan x="1590.0" y="827.0">浮点位型或整数编码</tspan>
    <tspan x="1590.0" y="861.8000000000001">转换与量化次序明确</tspan>
  </text>
  <text x="900.0" y="1017.5" fill="#475569" font-family="Noto Sans CJK SC" font-size="23.0" font-weight="600" text-anchor="middle">
    <tspan x="900.0" y="1017.5">原始浮点位型不等于 signed INT32 数值；RNE、缩放、bias 与饱和均按具体操作定义。</tspan>
  </text>
