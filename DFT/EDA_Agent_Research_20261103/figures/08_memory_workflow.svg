<polygon points="1210,900 1216.0,885.0 1204.0,885.0" fill="#2963AE"/>
<text x="56" y="1090" fill="#56677D" font-size="22" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" text-anchor="start" dominant-baseline="central">评测时固定初始经验库；冷启动、只读经验与在线积累分别报告，防止任务间信息泄漏。</text>
<text x="1558" y="1162" fill="#56677D" font-size="18" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" text-anchor="end" dominant-baseline="central">EDA Agent 研究报告 · 2026-11-03 · 作者绘制</text>
