<text x="410.0" y="691" fill="#56677D" font-size="23" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" text-anchor="middle" dominant-baseline="central">成功与失败保留不同类型；失效、过时记录可撤回</text>
