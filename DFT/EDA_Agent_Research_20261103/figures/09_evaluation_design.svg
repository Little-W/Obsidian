<text x="800.0" y="736" fill="#56677D" font-size="23" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" text-anchor="middle" dominant-baseline="central">正确完成率、错误接纳率、缺陷检出率、总工具小时、延迟、人工介入</text>
