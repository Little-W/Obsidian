  <g id="layer-background">
    <rect width="1200" height="1620" fill="#FFFFFF" />
  </g>
  <g id="layer-shapes">
    <rect id="input" x="400" y="240" width="400" height="190" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="good" x="70" y="650" width="460" height="210" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="bad" x="670" y="650" width="460" height="210" rx="12" fill="#FFFFFF" stroke="#D97A16" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="compare" x="400" y="1120" width="400" height="190" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="require" x="400" y="1450" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
  </g>
  <g id="layer-connectors">
    <polyline id="shared" points="600,430 600,510" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="正常与故障模型共享相同输入变量" data-source-node="input" data-source-side="S" data-source-fraction="0.5" data-target-junction="split" />
    <polyline id="good-input" points="600,510 300,510 300,650" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="共同输入进入正常模型" data-source-junction="split" data-target-node="good" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="bad-input" points="600,510 900,510 900,650" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="共同输入进入故障模型" data-source-junction="split" data-target-node="bad" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="good-output" points="300,860 300,1010 500,1010 500,1120" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="正常输出参与逐位比较" data-source-node="good" data-source-side="S" data-source-fraction="0.5" data-target-node="compare" data-target-side="N" data-target-fraction="0.25" marker-end="url(#arrow-blue)" />
    <polyline id="bad-output" points="900,860 900,1010 700,1010 700,1120" fill="none" stroke="#D97A16" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="故障输出参与逐位比较" data-source-node="bad" data-source-side="S" data-source-fraction="0.5" data-target-node="compare" data-target-side="N" data-target-fraction="0.75" marker-end="url(#arrow-orange)" />
    <polyline id="detection" points="600,1310 600,1450" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="差异条件为真就是一个故障检测向量" data-source-node="compare" data-source-side="S" data-source-fraction="0.5" data-target-node="require" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
  </g>
  <g id="layer-text">
    <text id="text-0001" x="64" y="80" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="48" font-weight="700" fill="#172D46" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">图12  SAT 的正常与故障双电路</text>
    <text id="text-0002" x="64" y="145" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#4F6278" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">同一组输入进入两份模型；只在指定位置注入故障。</text>
    <text id="text-0003" x="600.0" y="288" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="input">共同输入 x</text>
    <text id="text-0004" x="600.0" y="346" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="32" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="input">加上合法模式限制</text>
    <text id="text-0005" x="300.0" y="698" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="good">正常电路 C(x)</text>
    <text id="text-0006" x="300.0" y="756" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="32" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="good">每个门满足正常关系</text>
    <text id="text-0007" x="900.0" y="698" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#D97A16" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="bad">故障电路 Cf(x)</text>
    <text id="text-0008" x="900.0" y="756" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="32" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="bad">只替换指定故障位置</text>
    <text id="text-0009" x="600.0" y="1168" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="compare">比较可观察输出</text>
    <text id="text-0010" x="600.0" y="1226" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="compare">逐位 XOR，再做 OR</text>
    <text id="text-0011" x="600.0" y="1505.0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="32" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="require">要求至少一位不同</text>
  </g>
