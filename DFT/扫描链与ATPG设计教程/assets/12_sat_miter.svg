<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="fig-title fig-description" version="1.1" data-layout-version="precise-ports-v2">
  <title id="fig-title">图12  SAT 的正常与故障双电路</title>
  <desc id="fig-description">同一组输入进入两份模型；只在指定位置注入故障。</desc>
  <metadata>{"layout": "named ports + orthogonal routes", "font_policy": "editable text; no embedded fonts", "version": 2}</metadata>
  <defs>
