    <polyline id="e2" points="600,640 600,720" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="从上一阶段进入下一阶段" data-source-node="n1" data-source-side="S" data-source-fraction="0.5" data-target-node="n2" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="e3" points="600,880 600,960" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="从上一阶段进入下一阶段" data-source-node="n2" data-source-side="S" data-source-fraction="0.5" data-target-node="n3" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
