  <g id="layer-connectors">
    <polyline id="functional" points="370,405 450,405" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="正常信号进入控制点" data-source-node="function" data-source-side="E" data-source-fraction="0.5" data-target-node="control" data-target-side="W" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="controlled" points="750,405 830,405" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="功能模式透明传递，测试模式按设计控制" data-source-node="control" data-source-side="E" data-source-fraction="0.5" data-target-node="downstream" data-target-side="W" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
