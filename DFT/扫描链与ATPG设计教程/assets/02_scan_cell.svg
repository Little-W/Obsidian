  <g id="layer-connectors">
    <polyline id="functional" points="370,315 440,315 440,442.5 510,442.5" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="功能数据进入选择器的功能输入" data-source-node="func" data-source-side="E" data-source-fraction="0.5" data-target-node="mux" data-target-side="W" data-target-fraction="0.25" marker-end="url(#arrow-blue)" />
    <polyline id="scan_data" points="370,565 440,565 440,577.5 510,577.5" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="串行数据进入选择器的扫描输入" data-source-node="si" data-source-side="E" data-source-fraction="0.5" data-target-node="mux" data-target-side="W" data-target-fraction="0.75" marker-end="url(#arrow-blue)" />
