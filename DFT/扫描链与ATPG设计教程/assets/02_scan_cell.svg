    <rect id="mux" x="510" y="375" width="280" height="270" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="ff" x="910" y="410" width="220" height="200" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
