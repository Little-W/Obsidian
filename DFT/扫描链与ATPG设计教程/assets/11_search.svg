    <polyline id="goal-decide" points="600,800 600,940" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="按目标逐步约束并检验电路" data-source-node="goal" data-source-side="S" data-source-fraction="0.5" data-target-node="decide" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="decide-check" points="600,1150 600,1290" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="按目标逐步约束并检验电路" data-source-node="decide" data-source-side="S" data-source-fraction="0.5" data-target-node="check" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
