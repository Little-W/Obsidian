  <g id="layer-background">
    <rect width="1200" height="1565" fill="#FFFFFF" />
  </g>
  <g id="layer-shapes">
    <rect id="n0" x="150" y="240" width="900" height="210" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="n1" x="150" y="550" width="900" height="210" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="n2" x="150" y="860" width="900" height="210" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
