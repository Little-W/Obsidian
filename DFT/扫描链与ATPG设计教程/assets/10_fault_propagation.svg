<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1770" viewBox="0 0 1200 1770" role="img" aria-labelledby="fig-title fig-description" version="1.1" data-layout-version="precise-ports-v2">
  <title id="fig-title">图10  激活 n1 固定零并观察差异</title>
  <desc id="fig-description">a=b=1 激活目标；通过 c=0 的 OR 路径观察，也可利用 z。</desc>
  <metadata>{"layout": "named ports + orthogonal routes", "font_policy": "editable text; no embedded fonts", "version": 2}</metadata>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#1967A4" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#118575" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#D97A16" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#B84051" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#4F6278" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#738A9F" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#92517C" />
    </marker>
  </defs>
  <g id="layer-background">
    <rect width="1200" height="1770" fill="#FFFFFF" />
  </g>
  <g id="layer-shapes">
    <rect id="a" x="80" y="280" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="b" x="870" y="280" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="n1" x="450" y="450" width="300" height="210" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="n2" x="450" y="800" width="300" height="160" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="z" x="900" y="775" width="230" height="210" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="c" x="80" y="830" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="y" x="450" y="1150" width="300" height="160" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
    <rect id="d" x="80" y="1180" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#1967A4" stroke-width="2" data-kind="node" data-obstacle="true" />
  </g>
  <g id="layer-connectors">
    <polyline id="a-input" points="330,330 525,330 525,450" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="a=1 是激活 n1/sa0 的必要条件" data-source-node="a" data-source-side="E" data-source-fraction="0.5" data-target-node="n1" data-target-side="N" data-target-fraction="0.25" marker-end="url(#arrow-blue)" />
    <polyline id="b-input" points="870,330 675,330 675,450" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="b=1 是激活 n1/sa0 的必要条件" data-source-node="b" data-source-side="W" data-source-fraction="0.5" data-target-node="n1" data-target-side="N" data-target-fraction="0.75" marker-end="url(#arrow-blue)" />
    <polyline id="n1-stem" points="600,660 600,710" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="n1 同时驱动 n2 与 z" data-source-node="n1" data-source-side="S" data-source-fraction="0.5" data-target-junction="n1-fanout" />
    <polyline id="to-or" points="600,710 600,800" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="差异进入 OR 的一个输入" data-source-junction="n1-fanout" data-target-node="n2" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="to-z" points="600,710 1015,710 1015,775" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="同一个 n1 干线也驱动 z 的一个输入" data-source-junction="n1-fanout" data-target-node="z" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="c-input" points="330,880 450,880" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="c=0 避免 OR 门遮蔽 n1 的差异" data-source-node="c" data-source-side="E" data-source-fraction="0.5" data-target-node="n2" data-target-side="W" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="or-to-y" points="600,960 600,1150" fill="none" stroke="#1967A4" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="OR 的差异继续进入 XOR" data-source-node="n2" data-source-side="S" data-source-fraction="0.5" data-target-node="y" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-blue)" />
    <polyline id="d-stem" points="330,1230 390,1230" fill="none" stroke="#118575" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="d 是两个门共用的输入，不是独立变量" data-source-node="d" data-source-side="E" data-source-fraction="0.5" data-target-junction="d-fanout" />
    <polyline id="d-to-y" points="390,1230 450,1230" fill="none" stroke="#118575" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="XOR 的确定输入不会遮蔽差异" data-source-junction="d-fanout" data-target-node="y" data-target-side="W" data-target-fraction="0.5" marker-end="url(#arrow-teal)" />
    <polyline id="d-to-z" points="390,1230 390,1460 1160,1460 1160,880 1130,880" fill="none" stroke="#118575" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="d 同时接 z 的第二输入；d=1 时 z 也能观察" data-source-junction="d-fanout" data-target-node="z" data-target-side="E" data-target-fraction="0.5" marker-end="url(#arrow-teal)" />
  </g>
  <g id="layer-text">
    <text id="text-0001" x="64" y="80" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="48" font-weight="700" fill="#172D46" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">图10  激活 n1 固定零并观察差异</text>
    <text id="text-0002" x="64" y="145" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#4F6278" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">a=b=1 激活目标；通过 c=0 的 OR 路径观察，也可利用 z。</text>
    <text id="text-0003" x="205.0" y="330.0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="a">a = 1</text>
    <text id="text-0004" x="995.0" y="330.0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="b">b = 1</text>
    <text id="text-0005" x="600.0" y="498" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="n1">n1 = AND</text>
    <text id="text-0006" x="600.0" y="556" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="n1">正常 1</text>
    <text id="text-0007" x="600.0" y="606" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="n1">故障 0</text>
    <text id="text-0008" x="600.0" y="848" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="n2">n2 = OR</text>
    <text id="text-0009" x="600.0" y="906" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="n2">c 取 0</text>
    <text id="text-0010" x="1015.0" y="823" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="z">z = AND</text>
    <text id="text-0011" x="1015.0" y="881" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="28" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="z">d = 1</text>
    <text id="text-0012" x="1015.0" y="931" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="28" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="z">可以观察</text>
    <text id="text-0013" x="205.0" y="880.0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="c">c = 0</text>
    <text id="text-0014" x="600.0" y="1198" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="36" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="y">y = XOR</text>
    <text id="text-0015" x="600.0" y="1256" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#172D46" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="y">可以观察</text>
    <text id="text-0016" x="205.0" y="1230.0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="700" fill="#1967A4" text-anchor="middle" dominant-baseline="central" data-kind="text" data-padding="20" data-owner="d">d = 0 或 1</text>
    <text id="text-0017" x="64" y="1570" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#4F6278" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">测试立方体 110X 的两种补全均能检测 n1/sa0。</text>
    <text id="text-0018" x="64" y="1616" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#4F6278" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">当 c=1 遮蔽上方路径时，仍可令 d=1 从 z 观察。</text>
    <text id="text-0019" x="64" y="1662" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#4F6278" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">圆点表示真实分支；两处出现的 d 必须是同一个值。</text>
  </g>
  <g id="layer-junctions">
    <circle id="n1-fanout" cx="600" cy="710" r="4.5" fill="#1967A4" data-kind="junction" />
    <circle id="d-fanout" cx="390" cy="1230" r="4.5" fill="#118575" data-kind="junction" />
  </g>
</svg>