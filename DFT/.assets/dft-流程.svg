<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16a34a"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#64748b" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.label{font:600 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#fff}.sub{font:18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#334155}.note{font:16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="title">数字电路 DFT 设计闭环</text>
  <text x="600" y="88" text-anchor="middle" class="note">从 RTL/网表准备，到扫描插入、规则检查、ATPG 与交付</text>
  <g filter="url(#shadow)">
    <rect x="55" y="170" width="190" height="150" rx="20" fill="url(#blue)"/>
    <rect x="300" y="170" width="190" height="150" rx="20" fill="url(#green)"/>
    <rect x="545" y="170" width="190" height="150" rx="20" fill="url(#orange)"/>
    <rect x="790" y="170" width="160" height="150" rx="20" fill="#7c3aed"/>
    <rect x="990" y="170" width="155" height="150" rx="20" fill="#0f766e"/>
  </g>
  <text x="150" y="220" text-anchor="middle" class="label">1. 设计准备</text>
  <text x="150" y="258" text-anchor="middle" class="sub" fill="#dbeafe">RTL / 网表</text>
  <text x="150" y="286" text-anchor="middle" class="sub" fill="#dbeafe">工艺库与时序约束</text>
  <text x="395" y="220" text-anchor="middle" class="label">2. 测试协议</text>
  <text x="395" y="258" text-anchor="middle" class="sub">时钟、复位、扫描端口</text>
  <text x="395" y="286" text-anchor="middle" class="sub">test protocol / SPF</text>
  <text x="640" y="220" text-anchor="middle" class="label">3. 扫描插入</text>
  <text x="640" y="258" text-anchor="middle" class="sub">普通触发器 → 扫描触发器</text>
  <text x="640" y="286" text-anchor="middle" class="sub">生成扫描链</text>
  <text x="870" y="220" text-anchor="middle" class="label">4. DRC</text>
  <text x="870" y="258" text-anchor="middle" class="sub">检查测试可控性</text>
  <text x="870" y="286" text-anchor="middle" class="sub">修复违规</text>
  <text x="1067" y="220" text-anchor="middle" class="label">5. ATPG</text>
  <text x="1067" y="258" text-anchor="middle" class="sub">覆盖率 / 向量</text>
  <text x="1067" y="286" text-anchor="middle" class="sub">交付网表与协议</text>
  <path d="M245 245 H292" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M490 245 H537" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M735 245 H782" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M950 245 H982" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1067 340 V430 H395 V340" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="730" y="462" text-anchor="middle" class="note">若 DRC 或覆盖率不达标，返回协议、约束或扫描结构重新迭代</text>
  <rect x="185" y="510" width="830" height="55" rx="27" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="600" y="546" text-anchor="middle" class="sub">核心目标：提高内部状态的可控性与可观测性，降低测试成本</text>
</svg>
