<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-label="把外部步骤方案变成可验证的配置"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="880" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">把外部步骤方案变成可验证的配置</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">先保留已知正确的控制器与接口，再在其内部调整 Step。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><rect x="45" y="165" width="360" height="160" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="225.0" y="203" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">1  工具导出基线</text><text x="225.0" y="241" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">完整 DftSpecification</text><text x="225.0" y="272" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">实例属性与原有接口</text><rect x="540" y="165" width="360" height="160" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="203" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">2  外部求解器</text><text x="720.0" y="241" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">贪心 / 小规模精确划分</text><text x="720.0" y="272" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">输出 steps_plan.json</text><rect x="1035" y="165" width="360" height="160" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="1215.0" y="203" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">3  保守配置改写</text><text x="1215.0" y="241" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">移动整个 MemoryInterface</text><text x="1215.0" y="272" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">不丢失原有接口参数</text><path d="M405 245 H530" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M900 245 H1025" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M1215 325 V475" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="45" y="485" width="360" height="160" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="225.0" y="523" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">6  比较实际结果</text><text x="225.0" y="561" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">地址轨迹、时间、面积</text><text x="225.0" y="592" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">记录失败与无改善结果</text><rect x="540" y="485" width="360" height="160" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="523" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">5  生成与验证</text><text x="720.0" y="561" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">插入硬件、生成图形</text><text x="720.0" y="592" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">完整地址 / 故障检查</text><rect x="1035" y="485" width="360" height="160" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="1215.0" y="523" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">4  新会话导入</text><text x="1215.0" y="561" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">重新加载相同设计与库</text><text x="1215.0" y="592" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">validate_only 必须通过</text><path d="M1035 565 H910" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M540 565 H415" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="160" y="705" width="1120" height="100" rx="12" fill="#fff4e4" stroke="#cbd8e1" stroke-width="2"/><text x="720" y="747" font-size="27" text-anchor="middle" font-weight="700" style="fill:#ac6b23">标签输入只限制边界；精确 Step 清单需要实际配置树和校验。</text><text x="720" y="783" font-size="25" text-anchor="middle" font-weight="400" style="fill:#546b7b">离线编辑成功 ≠ Tessent 已接受 ≠ 硬件已验证</text><text x="42" y="850" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">合成示例配置不能直接替代真实工程导出的配置。</text></svg>