<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-label="硬编码与软可编程算法"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="800" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">硬编码与软可编程算法</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">两种方式都要在 Patterns 中确认本次执行选择。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><text x="45" y="189" font-size="29" text-anchor="start" font-weight="700" style="fill:#255f8b">硬编码</text><text x="45" y="451" font-size="29" text-anchor="start" font-weight="700" style="fill:#117c76">软可编程</text><rect x="250" y="145" width="350" height="150" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="425.0" y="183" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">插入前读取 UDA</text><text x="425.0" y="221" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">算法 + 操作集合</text><text x="425.0" y="252" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">确定硬件支持范围</text><rect x="645" y="145" width="350" height="150" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="820.0" y="183" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">生成控制器 RTL</text><text x="820.0" y="221" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">算法被固化到硬件</text><text x="820.0" y="252" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">再综合与实现</text><rect x="1040" y="145" width="350" height="150" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="1215.0" y="183" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">测试时选择执行</text><text x="1215.0" y="221" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">无需重新下载此算法</text><text x="1215.0" y="252" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">仍需配置与启动</text><rect x="250" y="407" width="350" height="150" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="425.0" y="445" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">插入前预留资源</text><text x="425.0" y="483" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">指令容量、操作与地址能力</text><text x="425.0" y="514" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">资源不足不能后补硬件</text><rect x="645" y="407" width="350" height="150" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="820.0" y="445" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">测试时装载微程序</text><text x="820.0" y="483" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">通过测试访问结构移入</text><text x="820.0" y="514" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">计入 TCK 装载开销</text><rect x="1040" y="407" width="350" height="150" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="1215.0" y="445" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">高速宏测试</text><text x="1215.0" y="483" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">在已有能力范围内执行</text><text x="1215.0" y="514" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">完整地址与故障回归</text><path d="M600 220 H635" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M995 220 H1030" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M600 482 H635" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M995 482 H1030" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="250" y="630" width="1140" height="95" rx="12" fill="#fff4e4" stroke="#cbd8e1" stroke-width="2"/><text x="820" y="673" font-size="27" text-anchor="middle" font-weight="700" style="fill:#ac6b23">可修改“程序” ≠ 可添加任意新端口时序和硬件资源</text><text x="820" y="707" font-size="23" text-anchor="middle" font-weight="400" style="fill:#546b7b">下载快慢与 SRAM 测试执行频率是不同问题。</text><text x="42" y="770" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">原创时间线；装载范围、复位行为与资源限制应以实际控制器配置为准。</text></svg>