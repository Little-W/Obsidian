<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-label="验证证据必须对应具体对象"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="920" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">验证证据必须对应具体对象</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">后一个层次不会因为前一个层次显示通过而自动完成。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><text x="100" y="167" font-size="26" text-anchor="start" font-weight="700" style="fill:#17364d">验证层次</text><text x="550" y="167" font-size="26" text-anchor="start" font-weight="700" style="fill:#17364d">检查对象</text><text x="1030" y="167" font-size="26" text-anchor="start" font-weight="700" style="fill:#17364d">可支持的结论</text><rect x="45" y="195" width="1350" height="80" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="75" y="244" font-size="26" text-anchor="start" font-weight="600" style="fill:#17364d">操作级模型</text><text x="510" y="244" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">地址与数据序列</text><text x="980" y="244" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">符合抽象 March 定义</text><rect x="45" y="295" width="1350" height="80" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="75" y="344" font-size="26" text-anchor="start" font-weight="600" style="fill:#17364d">配置规则检查</text><text x="510" y="344" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">库、对象与相容关系</text><text x="980" y="344" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">所检配置可被工具接受</text><rect x="45" y="395" width="1350" height="80" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="75" y="444" font-size="26" text-anchor="start" font-weight="600" style="fill:#17364d">无故障 RTL 仿真</text><text x="510" y="444" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">接口与生成逻辑</text><text x="980" y="444" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">所测场景执行无误报</text><rect x="45" y="495" width="1350" height="80" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="75" y="544" font-size="26" text-anchor="start" font-weight="600" style="fill:#17364d">故障注入</text><text x="510" y="544" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">明确的故障模型实例</text><text x="980" y="544" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">这些故障被观察和报告</text><rect x="45" y="595" width="1350" height="80" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="75" y="644" font-size="26" text-anchor="start" font-weight="600" style="fill:#17364d">综合后与时序验证</text><text x="510" y="644" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">映射逻辑、模式和时钟</text><text x="980" y="644" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">指定条件下功能及时序</text><rect x="45" y="695" width="1350" height="80" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="75" y="744" font-size="26" text-anchor="start" font-weight="600" style="fill:#17364d">物理与功率分析</text><text x="510" y="744" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">位置、寄生、活动与供电</text><text x="980" y="744" font-size="25" text-anchor="start" font-weight="400" style="fill:#17364d">实现的电气证据</text><text x="720" y="848" font-size="27" text-anchor="middle" font-weight="700" style="fill:#ac6b23">资料包已运行：离线参考模型与配置编辑测试；商业 EDA 阶段未执行。</text><text x="42" y="890" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">通过的对象、地址范围、故障集合、版本和假设都应记录，不能合并成一个没有范围的 PASS。</text></svg>