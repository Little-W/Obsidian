<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-label="并行步骤的联合地址范围可能扩大"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="880" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">并行步骤的联合地址范围可能扩大</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">教学例：容量相同，但行与列选择数不相同。网格为缩略示意。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><text x="350" y="165" font-size="28" text-anchor="middle" font-weight="700" style="fill:#17364d">宏 A：128 行 × 4 列</text><text x="1080" y="165" font-size="28" text-anchor="middle" font-weight="700" style="fill:#17364d">宏 B：32 行 × 16 列</text><rect x="100" y="195" width="500" height="210" rx="0" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><rect x="830" y="195" width="500" height="210" rx="0" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><path d="M225 195 L225 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M350 195 L350 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M475 195 L475 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 221.25 L600 221.25" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 247.5 L600 247.5" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 273.75 L600 273.75" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 300.0 L600 300.0" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 326.25 L600 326.25" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 352.5 L600 352.5" stroke="#cbd8e1" stroke-width="1.5"/><path d="M100 378.75 L600 378.75" stroke="#cbd8e1" stroke-width="1.5"/><path d="M861.25 195 L861.25 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M892.5 195 L892.5 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M923.75 195 L923.75 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M955.0 195 L955.0 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M986.25 195 L986.25 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1017.5 195 L1017.5 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1048.75 195 L1048.75 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1080.0 195 L1080.0 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1111.25 195 L1111.25 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1142.5 195 L1142.5 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1173.75 195 L1173.75 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1205.0 195 L1205.0 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1236.25 195 L1236.25 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1267.5 195 L1267.5 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M1298.75 195 L1298.75 405" stroke="#cbd8e1" stroke-width="1.5"/><path d="M830 300 L1330 300" stroke="#cbd8e1" stroke-width="1.5"/><text x="350" y="447" font-size="27" text-anchor="middle" font-weight="400" style="fill:#17364d">512 字地址</text><text x="1080" y="447" font-size="27" text-anchor="middle" font-weight="400" style="fill:#17364d">512 字地址</text><path d="M350 460 V500 H620 V530" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M1080 460 V500 H820 V530" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="290" y="545" width="860" height="140" rx="12" fill="#fff4e4" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="583" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">共享范围：max(128,32) × max(4,16)</text><text x="720.0" y="621" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">= 128 × 16 = 2048 次地址计数位置</text><text x="720" y="747" font-size="28" text-anchor="middle" font-weight="700" style="fill:#117c76">分别遍历：512 + 512 = 1024；联合范围反而更大。</text><text x="42" y="850" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">具体是否发生、周期如何计算，要结合计数器、越界屏蔽和工具估算；不能一概用 max(Tᵢ)。</text></svg>