<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-label="Controller、Step 与全芯片并发"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="850" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">Controller、Step 与全芯片并发</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">控制器内的步骤依次执行；不同控制器是否并行由测试计划决定。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><rect x="45" y="155" width="650" height="490" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="370" y="202" font-size="30" text-anchor="middle" font-weight="700" style="fill:#17364d">Controller c1</text><rect x="85" y="235" width="570" height="145" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="370.0" y="273" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Step 0</text><text x="370.0" y="311" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">SRAM A + SRAM B 同时执行</text><text x="370.0" y="342" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">示例活动功率：60 mW</text><path d="M370 380 V420" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="85" y="430" width="570" height="145" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="370.0" y="468" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Step 1</text><text x="370.0" y="506" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">SRAM C 单独执行</text><text x="370.0" y="537" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">要等 Step 0 完成</text><rect x="745" y="155" width="650" height="490" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="1070" y="202" font-size="30" text-anchor="middle" font-weight="700" style="fill:#17364d">Controller c2</text><rect x="785" y="235" width="570" height="145" rx="12" fill="#fff4e4" stroke="#cbd8e1" stroke-width="2"/><text x="1070.0" y="273" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Step 0</text><text x="1070.0" y="311" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">SRAM D + SRAM E 同时执行</text><text x="1070.0" y="342" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">示例活动功率：50 mW</text><text x="1070" y="487" font-size="27" text-anchor="middle" font-weight="400" style="fill:#546b7b">可与 c1 的某一步重叠</text><text x="1070" y="533" font-size="27" text-anchor="middle" font-weight="400" style="fill:#546b7b">但必须检查芯片级预算</text><rect x="170" y="690" width="1100" height="95" rx="12" fill="#ffffff" stroke="#cbd8e1" stroke-width="2"/><text x="720" y="732" font-size="29" text-anchor="middle" font-weight="700" style="fill:#ac6b23">每个 Step ≤ 60 mW，不代表总并发 ≤ 60 mW</text><text x="720" y="769" font-size="24" text-anchor="middle" font-weight="400" style="fill:#546b7b">重叠时仅两个步骤的存储器部分就可能达到 60 + 50 = 110 mW。</text><text x="42" y="820" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">还应计入控制器、时钟网络与其他活动；数值仅用于说明层次差别。</text></svg>