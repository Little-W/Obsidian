<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-label="三个不同层次的“步骤”"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="800" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">三个不同层次的“步骤”</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">同一个词不代表同一个对象；不能用 March 元素数代替测试分组数。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><rect x="45" y="170" width="415" height="165" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="252.5" y="208" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Algorithm / Instruction</text><text x="252.5" y="246" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">M0：↑ w0</text><text x="252.5" y="277" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">M1：↑ r0,w1；……</text><text x="252.5" y="308" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">一个宏内部的操作序列</text><rect x="512" y="170" width="415" height="165" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="719.5" y="208" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Controller / Step</text><text x="719.5" y="246" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">Step 0：SRAM A + B</text><text x="719.5" y="277" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">Step 1：SRAM C</text><text x="719.5" y="308" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">每批接口执行所选完整算法</text><rect x="980" y="170" width="415" height="165" rx="12" fill="#fff4e4" stroke="#cbd8e1" stroke-width="2"/><text x="1187.5" y="208" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Patterns / TestStep</text><text x="1187.5" y="246" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">一次配置和启动阶段</text><text x="1187.5" y="277" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">可以列出多个 Controller</text><text x="1187.5" y="308" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">决定本次实际执行安排</text><path d="M460 250 H502" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><path d="M927 250 H970" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="120" y="430" width="1200" height="245" rx="12" fill="#ffffff" stroke="#cbd8e1" stroke-width="2"/><text x="155" y="477" font-size="27" text-anchor="start" font-weight="700" style="fill:#17364d">例：TestStep(run_time_prog)</text><text x="175" y="529" font-size="27" text-anchor="start" font-weight="400" style="fill:#17364d">Controller c1 → Step 0：A、B 同时运行六个 March 元素</text><text x="175" y="579" font-size="27" text-anchor="start" font-weight="400" style="fill:#17364d">Controller c1 → Step 1：C 运行六个 March 元素</text><text x="175" y="629" font-size="27" text-anchor="start" font-weight="400" style="fill:#17364d">Controller c2 → 可在同一图形阶段执行自己的步骤</text><text x="42" y="770" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">DftSpecification 的 Step 通常为无名称 wrapper；Patterns 的 TestStep 可以有标识。</text></svg>