<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-label="从设计输入到验证与物理实现"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="830" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">从设计输入到验证与物理实现</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">在 create_dft_specification 与 process_dft_specification 之间审查算法与分组。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><rect x="45" y="155" width="300" height="135" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="195.0" y="193" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">1  读取设计与库</text><text x="195.0" y="231" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">RTL / TCD / 单元库</text><path d="M345 222 H385" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="395" y="155" width="300" height="135" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="545.0" y="193" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">2  时钟与规则</text><text x="545.0" y="231" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">时钟、模式、DRC</text><path d="M695 222 H735" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="745" y="155" width="300" height="135" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="895.0" y="193" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">3  创建配置</text><text x="895.0" y="231" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">自动分组 / 外部方案</text><path d="M1045 222 H1085" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="1095" y="155" width="300" height="135" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="1245.0" y="193" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">4  校验配置</text><text x="1245.0" y="231" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">validate_only</text><rect x="45" y="505" width="300" height="135" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="195.0" y="543" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">8  综合与物理</text><text x="195.0" y="581" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">STA、功率、实际布线</text><rect x="395" y="505" width="300" height="135" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="545.0" y="543" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">7  生成图形与仿真</text><text x="545.0" y="581" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">算法选择、完整地址</text><path d="M395 572 H355" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="745" y="505" width="300" height="135" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="895.0" y="543" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">6  提取访问描述</text><text x="895.0" y="581" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">extract_icl</text><path d="M745 572 H705" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="1095" y="505" width="300" height="135" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="1245.0" y="543" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">5  生成与插入</text><text x="1245.0" y="581" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">测试 RTL / TSDB</text><path d="M