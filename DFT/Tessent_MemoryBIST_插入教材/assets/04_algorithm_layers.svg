<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-label="自定义 March 算法的表达层次"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#546b7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17364d;} .mono{font-family:"DejaVu Sans Mono",monospace;}</style><rect width="1440" height="850" rx="18" fill="white"/><text x="42" y="54" font-size="34" text-anchor="start" font-weight="700" style="fill:#17364d">自定义 March 算法的表达层次</text><text x="42" y="96" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">Algorithm 改变访问编排；OperationSet 改变单次操作的周期与控制。</text><path d="M42 117 H1398" stroke="#cbd8e1" stroke-width="2"/><rect x="180" y="155" width="1080" height="120" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="193" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">数学序列</text><text x="720.0" y="231" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">↑(r0,w1)：在每个地址先读 0，再写 1</text><path d="M720 275 V305" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="180" y="315" width="1080" height="120" rx="12" fill="#eaf5f1" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="353" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Algorithm / MicroProgram</text><text x="720.0" y="391" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">方向、数据选择、NextConditions、循环与边界</text><path d="M720 435 V465" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="180" y="475" width="1080" height="120" rx="12" fill="#fff4e4" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="513" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">OperationSet / Operation / Cycle</text><text x="720.0" y="551" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">Read、Write、ReadModifyWrite 的时钟周期与采样</text><path d="M720 595 V625" fill="none" stroke="#546b7b" stroke-width="2.6" marker-end="url(#arr)"/><rect x="180" y="635" width="1080" height="120" rx="12" fill="#edf4f8" stroke="#cbd8e1" stroke-width="2"/><text x="720.0" y="673" font-size="27" text-anchor="middle" font-weight="700" style="fill:#17364d">Memory TCD 与真实宏端口</text><text x="720.0" y="711" font-size="22" text-anchor="middle" font-weight="400" style="fill:#546b7b">地址组织、控制极性、读延迟、写掩码与宏模型</text><text x="42" y="820" font-size="22" text-anchor="start" font-weight="400" style="fill:#546b7b">优先复用已经验证的 OperationSet；换算法不等于需要重写宏时序。</text></svg>