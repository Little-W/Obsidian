[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-agent-flow"
version = "0.1.0"
description = "Auditable local agent flow for Design-for-Test ATPG optimization"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.6,<7",
  "qtawesome>=1.3,<2",
  "smolagents[openai]>=1.23,<2",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3.2,<4",
  "peft>=0.14,<1",
  "transformers>=4.48,<6",
  "trl>=0.14,<1",
]
test = ["pytest>=8,<10"]

[project.scripts]
dft-flow = "dft_agent_flow.cli:main"
dft-gui = "dft_agent_flow.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
