<text x="54" y="104" font-family="Noto Sans CJK SC, Noto Sans CJK JP, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="400" fill="#54677a" text-anchor="start">在线测试必须处理未完成事务和状态恢复；超时与测试失败要分别上报。</text>
