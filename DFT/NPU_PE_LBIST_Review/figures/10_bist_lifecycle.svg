<rect x="900" y="870" width="650" height="110" rx="14" fill="#eaf7f3" stroke="#157a73" stroke-width="2"/>
<text x="1225.0" y="933.4" font-family="Noto Sans CJK SC, Noto Sans CJK JP, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="400" fill="#142b43" text-anchor="middle">可选定位 → 恢复 / 隔离 → 上报 → 返回</text>
<polyline points="1350,760 1350,870" fill="none" stroke="#157a73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr_teal)"/>
<rect x="90" y="870" width="660" height="110" rx="14" fill="#fff0f1" stroke="#ae3346" stroke-width="2"/>
<text x="420.0" y="933.4" font-family="Noto Sans CJK SC, Noto Sans CJK JP, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="400" fill="#142b43" text-anchor="middle">终止规则：每个状态都有周期预算与异常出口</text>
<text x="850" y="1030" font-family="Noto Sans CJK SC, Noto Sans CJK JP, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="400" fill="#54677a" text-anchor="middle">上电测试通常无需保存业务状态；空闲期测试也不能默认内部寄存器无有效内容。</text>
