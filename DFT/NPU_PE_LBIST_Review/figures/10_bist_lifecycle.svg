<rect x="620" y="430" width="400" height="110" rx="14" fill="#fff4e6" stroke="#b76414" stroke-width="2"/>
<text x="820.0" y="493.75" font-family="Noto Sans CJK SC, Noto Sans CJK JP, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="400" fill="#142b43" text-anchor="middle">初始化寄存器和签名</text>
<rect x="90" y="430" width="400" height="110" rx="14" fill="#fff4e6" stroke="#b76414" stroke-width="2"/>
