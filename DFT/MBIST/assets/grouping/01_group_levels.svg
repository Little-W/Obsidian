<line x1="1027" y1="330" x2="1052" y2="330" stroke="#53697C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="535.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="29" fill="#168679" text-anchor="middle" font-weight="700">属性相容  ≠  必须同组  ≠  必须同时测试</text>
