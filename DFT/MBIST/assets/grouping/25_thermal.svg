<line x1="395" y1="380" x2="395" y2="455" stroke="#C47921" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<rect x="795" y="180" width="545" height="120" rx="12" fill="#FFFFFF" stroke="#CAD6E0" stroke-width="1.5"/>
<rect x="795" y="180" width="545" height="7" rx="0" fill="#245C91" stroke="#245C91" stroke-width="1.5"/>
<text x="817" y="227.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="start" font-weight="700">局部区域</text>
<text x="817" y="270.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#18324A" text-anchor="start" font-weight="400">全局功率合法，不等于所有区域安全</text>
<rect x="795" y="350" width="545" height="120" rx="12" fill="#FFFFFF" stroke="#CAD6E0" stroke-width="1.5"/>
