<text x="817" y="567.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#C47921" text-anchor="start" font-weight="700">验证条件</text>
<text x="815" y="592.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#18324A" text-anchor="start" font-weight="400">层间耦合、持续时间、冷却与模型误差</text>
<line x1="40" y1="646" x2="1360" y2="646" stroke="#CAD6E0" stroke-width="1"/>
<text x="55" y="683.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#53697C" text-anchor="start" font-weight="400">橙色仅表示垂直对齐的示意活动区域；本图不是目标芯片的温度仿真或热安全证明。</text>
