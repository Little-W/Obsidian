<polygon points="95,500 520,500 650,450 225,450" fill="#EDF3F8" fill-opacity="1" stroke="#245C91" stroke-width="2"/>
<polygon points="95,500 520,500 520,540 95,540" fill="#DFEAF3" fill-opacity="1" stroke="#245C91" stroke-width="2"/>
<polygon points="520,500 650,450 650,490 520,540" fill="#D5E3EF" fill-opacity="1" stroke="#245C91" stroke-width="2"/>
<polygon points="285,500 390,500 520,450 415,450" fill="#EDC996" fill-opacity="1" stroke="#C47921" stroke-width="2"/>
