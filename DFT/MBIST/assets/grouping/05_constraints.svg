<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">图06-05 两两可行，不代表整组可行</title><desc id="desc">集合容量和全组几何条件，必须在每次加入或合并后重新检查。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#53697C"/></marker></defs>
<rect x="0" y="0" width="1400" height="680" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="40" y="35" width="7" height="42" rx="0" fill="#168679" stroke="#168679" stroke-width="1.5"/>
<text x="65" y="68.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="33" fill="#18324A" text-anchor="start" font-weight="700">05  两两可行，不代表整组可行</text>
<text x="65" y="110.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#53697C" text-anchor="start" font-weight="400">集合容量和全组几何条件，必须在每次加入或合并后重新检查。</text>
<line x1="40" y1="132" x2="1360" y2="132" stroke="#CAD6E0" stroke-width="1"/>
<rect x="50" y="175" width="610" height="365" rx="12" fill="#FFFFFF" stroke="#CAD6E0" stroke-width="1.5"/>
<rect x="50" y="175" width="610" height="7" rx="0" fill="#245C91" stroke="#245C91" stroke-width="1.5"/>
<text x="72" y="222.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="start" font-weight="700">功率反例</text>
<text x="72" y="265.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#18324A" text-anchor="start" font-weight="400">每个实例 4 mW；组预算 10 mW</text>
<circle cx="160" cy="335" r="31" fill="#FFFFFF" stroke="#245C91" stroke-width="2.5"/>
<text x="160" y="344.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="middle" font-weight="700">A</text>
<text x="160" y="395.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#53697C" text-anchor="middle" font-weight="400">4 mW</text>
<circle cx="350" cy="335" r="31" fill="#FFFFFF" stroke="#245C91" stroke-width="2.5"/>
<text x="350" y="344.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="middle" font-weight="700">B</text>
<text x="350" y="395.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#53697C" text-anchor="middle" font-weight="400">4 mW</text>
<circle cx="540" cy="335" r="31" fill="#FFFFFF" stroke="#245C91" stroke-width="2.5"/>
<text x="540" y="344.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="middle" font-weight="700">C</text>
<text x="540" y="395.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#53697C" text-anchor="middle" font-weight="400">4 mW</text>
<text x="355" y="450.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="27" fill="#168679" text-anchor="middle" font-weight="600">任意两个：8 ≤ 10</text>
<text x="355" y="495.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="27" fill="#B14A49" text-anchor="middle" font-weight="600">三个同时：12 &gt; 10</text>
<rect x="740" y="175" width="610" height="365" rx="12" fill="#FFFFFF" stroke="#CAD6E0" stroke-width="1.5"/>
<rect x="740" y="175" width="610" height="7" rx="0" fill="#168679" stroke="#168679" stroke-width="1.5"/>
<text x="762" y="222.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#168679" text-anchor="start" font-weight="700">几何反例</text>
<text x="762" y="265.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#18324A" text-anchor="start" font-weight="400">最大两两距离要求 ≤ 5</text>
<circle cx="835" cy="335" r="31" fill="#FFFFFF" stroke="#245C91" stroke-width="2.5"/>
<text x="835" y="344.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="middle" font-weight="700">A</text>
<text x="835" y="395.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#53697C" text-anchor="middle" font-weight="400">x=0</text>
<circle cx="1045" cy="335" r="31" fill="#FFFFFF" stroke="#245C91" stroke-width="2.5"/>
<text x="1045" y="344.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="middle" font-weight="700">B</text>
<text x="1045" y="395.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#53697C" text-anchor="middle" font-weight="400">x=4</text>
<circle cx="1255" cy="335" r="31" fill="#FFFFFF" stroke="#245C91" stroke-width="2.5"/>
<text x="1255" y="344.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" fill="#245C91" text-anchor="middle" font-weight="700">C</text>
<text x="1255" y="395.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#53697C" text-anchor="middle" font-weight="400">x=8</text>
<line x1="870" y1="335" x2="1010" y2="335" stroke="#168679" stroke-width="2"/>
<line x1="1080" y1="335" x2="1220" y2="335" stroke="#168679" stroke-width="2"/>
<text x="1045" y="450.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="27" fill="#168679" text-anchor="middle" font-weight="400">A-B 与 B-C：都为 4</text>
<text x="1045" y="495.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="27" fill="#B14A49" text-anchor="middle" font-weight="600">整组 A-C：8 &gt; 5</text>
<line x1="40" y1="616" x2="1360" y2="616" stroke="#CAD6E0" stroke-width="1"/>
<text x="55" y="653.0" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#53697C" text-anchor="start" font-weight="400">没有冲突边或存在连续近邻，都不能代替对整组功率、人数和跨度的检查。</text>
</svg>