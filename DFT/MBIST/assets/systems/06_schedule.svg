    <text id="text-0021" x="64" y="1215" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="30" font-weight="400" fill="#4F6278" text-anchor="start" dominant-baseline="central" data-kind="text" data-padding="12">另一种三组方案 {A,B,C}、{D}、{E,F} 至少需要 19 μs。</text>
