    <polyline id="history1" points="600,430 600,485" fill="none" stroke="#4F6278" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt" data-kind="connector" data-meaning="在规定时间条件下连续执行" data-source-node="step0" data-source-side="S" data-source-fraction="0.5" data-target-node="step1" data-target-side="N" data-target-fraction="0.5" marker-end="url(#arrow-muted)" />
