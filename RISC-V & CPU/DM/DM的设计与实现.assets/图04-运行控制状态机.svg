<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="15" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#1f5e98"/></marker>
    <marker id="orange" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="15" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#d97706"/></marker>
    <style>
      .title { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 48px; font-weight: 700; fill: #15365b; }
      .sub { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 26px; fill: #49627f; }
      .state { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 33px; font-weight: 700; fill: #15365b; }
      .stateLong { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 27px; font-weight: 700; fill: #15365b; }
      .state2 { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 25px; fill: #24496d; }
      .label { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 26px; font-weight: 700; fill: #1f5e98; }
      .warn { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 25px; font-weight: 700; fill: #b45309; }
      .note { font-family: 'Noto Sans CJK SC', sans-serif; font-size: 25px; fill: #24496d; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="960" y="74" text-anchor="middle" class="title">DM 与 hart 的运行控制状态机</text>
  <text x="960" y="116" text-anchor="middle" class="sub">状态由 hart 的真实确认更新；请求必须保持到确认到达</text>

  <rect x="90" y="390" width="270" height="150" rx="22" fill="#e8f1fb" stroke="#1f5e98" stroke-width="5"/>
  <text x="225" y="450" text-anchor="middle" class="state">RUNNING</text>
  <text x="225" y="497" text-anchor="middle" class="state2">普通程序运行</text>

  <rect x="510" y="250" width="310" height="150" rx="22" fill="#fff4d5" stroke="#d97706" stroke-width="5"/>
  <text x="665" y="310" text-anchor="middle" class="stateLong">HALT_REQUESTED</text>
  <text x="665" y="357" text-anchor="middle" class="state2">DM 保持暂停请求</text>

  <rect x="980" y="250" width="270" height="150" rx="22" fill="#e5f4f5" stroke="#1f5e98" stroke-width="5"/>
  <text x="1115" y="310" text-anchor="middle" class="state">HALTED</text>
  <text x="1115" y="357" text-anchor="middle" class="state2">暂停循环就绪</text>

  <rect x="980" y="610" width="270" height="150" rx="22" fill="#eef5ff" stroke="#1f5e98" stroke-width="5"/>
  <text x="1115" y="670" text-anchor="middle" class="state">EXECUTING</text>
  <text x="1115" y="717" text-anchor="middle" class="state2">执行抽象程序或 PBuf</text>

  <rect x="1430" y="390" width="310" height="150" rx="22" fill="#fff4d5" stroke="#d97706" stroke-width="5"/>
  <text x="1585" y="450" text-anchor="middle" class="stateLong">RESUME_REQUESTED</text>
  <text x="1585" y="497" text-anchor="middle" class="state2">DM 保持恢复请求</text>

  <rect x="510" y="650" width="310" height="120" rx="22" fill="#f4edfb" stroke="#8a5ca8" stroke-width="5"/>
  <text x="665" y="703" text-anchor="middle" class="state">UNAVAILABLE</text>
  <text x="665" y="745" text-anchor="middle" class="state2">复位、掉电或时钟关闭</text>

  <path d="M360,430 L510,325" stroke="#d97706" stroke-width="7" fill="none" marker-end="url(#orange)"/>
  <text x="420" y="343" text-anchor="middle" class="warn">haltreq</text>
  <path d="M820,325 L980,325" stroke="#1f5e98" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <text x="900" y="292" text-anchor="middle" class="label">hart_halted</text>
  <path d="M1250,430 L1430,430" stroke="#d97706" stroke-width="7" fill="none" marker-end="url(#orange)"/>
  <text x="1340" y="395" text-anchor="middle" class="warn">resumereq</text>
  <path d="M1585,540 L1585,840 L225,840 L225,540" stroke="#1f5e98" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <text x="905" y="820" text-anchor="middle" class="label">resumeack / hart_running</text>

  <path d="M1115,400 L1115,610" stroke="#1f5e98" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <text x="1165" y="525" class="label">command / postexec</text>
  <path d="M1040,610 L1040,400" stroke="#1f5e98" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <text x="930" y="525" text-anchor="end" class="label">done</text>
  <path d="M1250,685 C1370,685 1370,775 1250,775 L1115,775" stroke="#d97706" stroke-width="6" fill="none" marker-end="url(#orange)"/>
  <text x="1360" y="750" class="warn">exception → cmderr</text>

  <path d="M575,400 L575,650" stroke="#8a5ca8" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <text x="510" y="545" text-anchor="end" class="label">hart_unavailable</text>
  <path d="M820,710 C900,710 900,430 980,430" stroke="#8a5ca8" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <text x="870" y="625" text-anchor="middle" class="label">重新可用并暂停</text>

  <rect x="170" y="875" width="1580" height="105" rx="18" fill="#fbfdff" stroke="#7fa5cb" stroke-width="3"/>
  <text x="210" y="927" class="state">设计要求</text>
  <text x="440" y="927" class="note">• <tspan font-family="monospace">dmstatus</tspan> 只依据真实反馈更新</text>
  <text x="890" y="927" class="note">• <tspan font-family="monospace">haltreq</tspan>/<tspan font-family="monospace">resumereq</tspan> 不使用固定延迟脉冲</text>
  <text x="1400" y="927" class="note">• 异常后 hart 保持暂停</text>
</svg>
