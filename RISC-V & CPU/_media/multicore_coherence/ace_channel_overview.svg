<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1120" viewBox="0 0 1920 1120">
  <defs>
    <marker id="ace-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="ace-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="ace-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="ace-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/>
    </marker>
    <style>
      .title { font: 700 44px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .actor { font: 700 28px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .label { font: 600 25px 'Noto Sans CJK SC', sans-serif; fill: #1E293B; }
      .small { font: 500 22px 'Noto Sans CJK SC', sans-serif; fill: #475569; }
      .tiny { font: 500 18px 'Noto Sans CJK SC', sans-serif; fill: #475569; }
      .note { font: 600 23px 'Noto Sans CJK SC', sans-serif; fill: #334155; }
      .lifeline { stroke: #94A3B8; stroke-width: 3; stroke-dasharray: 11 10; }
      .blue { fill: none; stroke: #2563EB; stroke-width: 5; marker-end: url(#ace-arrow-blue); }
      .red { fill: none; stroke: #DC2626; stroke-width: 5; marker-end: url(#ace-arrow-red); }
      .green { fill: none; stroke: #059669; stroke-width: 5; marker-end: url(#ace-arrow-green); }
      .orange { fill: none; stroke: #EA580C; stroke-width: 5; marker-end: url(#ace-arrow-orange); }
    </style>
  </defs>

  <rect width="1920" height="1120" fill="#FFFFFF"/>
  <text x="960" y="62" text-anchor="middle" class="title">ACE共享读的通道与信号关系</text>

  <rect x="70" y="105" width="390" height="92" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <rect x="555" y="105" width="390" height="92" rx="18" fill="#CCFBF1" stroke="#0F766E" stroke-width="4"/>
  <rect x="1040" y="105" width="390" height="92" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="4"/>
  <rect x="1525" y="105" width="325" height="92" rx="18" fill="#DCFCE7" stroke="#059669" stroke-width="4"/>
  <text x="265" y="145" text-anchor="middle" class="actor">ACE主设备</text>
  <text x="265" y="177" text-anchor="middle" class="small">发起访问并保存L1 Cache</text>
  <text x="750" y="162" text-anchor="middle" class="actor">ACE一致性互连</text>
  <text x="1235" y="145" text-anchor="middle" class="actor">被监听的主设备</text>
  <text x="1235" y="177" text-anchor="middle" class="small">查询L1 Cache状态</text>
  <text x="1687" y="162" text-anchor="middle" class="actor">共享存储</text>

  <line x1="265" y1="197" x2="265" y2="955" class="lifeline"/>
  <line x1="750" y1="197" x2="750" y2="955" class="lifeline"/>
  <line x1="1235" y1="197" x2="1235" y2="955" class="lifeline"/>
  <line x1="1687" y1="197" x2="1687" y2="955" class="lifeline"/>

  <line x1="275" y1="285" x2="740" y2="285" class="blue"/>
  <text x="505" y="252" text-anchor="middle" class="label">① AR通道发起共享读</text>
  <text x="505" y="322" text-anchor="middle" class="small">ARSNOOP · ARDOMAIN · ARBAR</text>

  <line x1="760" y1="415" x2="1225" y2="415" class="red"/>
  <text x="992" y="382" text-anchor="middle" class="label">② AC通道发送监听地址</text>
  <text x="992" y="452" text-anchor="middle" class="small">ACADDR · ACSNOOP · ACPROT</text>

  <line x1="760" y1="510" x2="1677" y2="510" class="green"/>
  <rect x="900" y="460" width="675" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="1237" y="487" text-anchor="middle" class="tiny">并行查询共享存储；若L1 Cache提供最新数据，则丢弃旧返回值</text>

  <line x1="1225" y1="600" x2="760" y2="600" class="orange"/>
  <text x="992" y="567" text-anchor="middle" class="label">③ CR通道返回监听结果</text>
  <text x="992" y="632" text-anchor="middle" class="tiny">CRRESP[0] DataTransfer · [2] PassDirty</text>
  <text x="992" y="658" text-anchor="middle" class="tiny">CRRESP[3] IsShared · [4] WasUnique</text>

  <line x1="1225" y1="720" x2="760" y2="720" class="green"/>
  <text x="992" y="687" text-anchor="middle" class="label">④ 需要时由CD通道返回整条Cache行</text>
  <text x="992" y="757" text-anchor="middle" class="tiny">CDDATA · CDLAST；无字节使能</text>

  <line x1="740" y1="835" x2="275" y2="835" class="blue"/>
  <text x="505" y="802" text-anchor="middle" class="label">⑤ R通道返回数据与一致性属性</text>
  <text x="505" y="872" text-anchor="middle" class="tiny">RRESP[3]=IsShared · RRESP[2]=PassDirty</text>

  <line x1="275" y1="940" x2="740" y2="940" class="blue"/>
  <text x="505" y="912" text-anchor="middle" class="small">⑥ 最后一拍完成后发送RACK；写事务对应WACK</text>

  <rect x="120" y="990" width="1680" height="82" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/>
  <text x="960" y="1022" text-anchor="middle" class="note">AC、CR和CD均采用VALID/READY握手。每个AC请求必须按顺序返回一个CR响应，只有CRRESP指示DataTransfer时才需要CD数据。</text>
  <text x="960" y="1054" text-anchor="middle" class="small">ACE-Lite主设备可以发起一致性访问，但没有AC、CR、CD、RACK和WACK，因此不能接收完整双向监听。</text>
</svg>
