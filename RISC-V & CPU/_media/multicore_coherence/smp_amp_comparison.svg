<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <style>
      .title { font: 58px "Noto Sans CJK SC", sans-serif; fill: #000000; text-anchor: middle; }
      .panel-title { font: 42px "Noto Sans CJK SC", sans-serif; fill: #000000; text-anchor: middle; }
      .node-title { font: 37px "Noto Sans CJK SC", sans-serif; fill: #0F172A; text-anchor: middle; }
      .node-text { font: 33px "Noto Sans CJK SC", sans-serif; fill: #0F172A; text-anchor: middle; }
      .edge-text { font: 29px "Noto Sans CJK SC", sans-serif; fill: #334155; text-anchor: middle; }
      .note-text { font: 29px "Noto Sans CJK SC", sans-serif; fill: #0F172A; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-dark); }
      .edge-both { fill: none; stroke: #475569; stroke-width: 5; stroke-linecap: round; marker-start: url(#arrow-dark); marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect x="0" y="0" width="2400" height="1500" fill="#FFFFFF"/>
  <text class="title" x="1200" y="92">SMP与AMP运行方式对比</text>

  <rect x="60" y="160" width="970" height="1280" rx="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="6"/>
  <rect x="1070" y="160" width="1270" height="1280" rx="30" fill="#ECFDF5" stroke="#059669" stroke-width="6"/>
  <text class="panel-title" x="545" y="230">SMP：统一操作系统与调度</text>
  <text class="panel-title" x="1705" y="230">AMP：软件映像与职责独立</text>

  <rect x="320" y="300" width="450" height="160" rx="24" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="5"/>
  <text class="node-title" x="545" y="365">同一操作系统内核</text>
  <text class="node-text" x="545" y="420">统一调度器</text>

  <rect x="130" y="600" width="350" height="160" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <text class="node-title" x="305" y="665">hart 0</text>
  <text class="node-text" x="305" y="720">CPU · L1 Cache</text>
  <rect x="610" y="600" width="350" height="160" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <text class="node-title" x="785" y="665">hart 1</text>
  <text class="node-text" x="785" y="720">CPU · L1 Cache</text>

  <rect x="330" y="900" width="430" height="170" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
  <text class="node-title" x="545" y="970">共享物理地址空间</text>
  <text class="node-text" x="545" y="1027">共享设备与内核对象</text>

  <rect x="240" y="1190" width="610" height="190" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="4"/>
  <text class="note-text" x="545" y="1250">线程可在任意hart运行</text>
  <text class="note-text" x="545" y="1300">依靠Cache一致性、原子操作</text>
  <text class="note-text" x="545" y="1350">与IPI（核间中断）协同</text>

  <path class="edge" d="M 410 460 C 365 505, 325 545, 305 600"/>
  <path class="edge" d="M 680 460 C 730 505, 775 545, 785 600"/>
  <path class="edge-both" d="M 305 760 C 320 820, 365 865, 420 900"/>
  <path class="edge-both" d="M 785 760 C 770 820, 725 865, 670 900"/>
  <path d="M 480 680 L 610 680" fill="none" stroke="#DC2626" stroke-width="5" stroke-dasharray="13 9" stroke-linecap="round" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>

  <g>
    <rect x="278" y="505" width="88" height="43" rx="7" fill="#EFF6FF"/>
    <text class="edge-text" x="322" y="537">调度</text>
    <rect x="724" y="505" width="88" height="43" rx="7" fill="#EFF6FF"/>
    <text class="edge-text" x="768" y="537">调度</text>
    <rect x="293" y="816" width="88" height="43" rx="7" fill="#EFF6FF"/>
    <text class="edge-text" x="337" y="848">读写</text>
    <rect x="709" y="816" width="88" height="43" rx="7" fill="#EFF6FF"/>
    <text class="edge-text" x="753" y="848">读写</text>
    <rect x="513" y="620" width="64" height="43" rx="7" fill="#EFF6FF"/>
    <text x="545" y="652" style="font: 29px 'Noto Sans CJK SC', sans-serif; fill: #B91C1C; text-anchor: middle;">IPI</text>
  </g>

  <rect x="1160" y="300" width="470" height="160" rx="24" fill="#D1FAE5" stroke="#047857" stroke-width="5"/>
  <text class="node-title" x="1395" y="365">主hart</text>
  <text class="node-text" x="1395" y="420">软件映像A · 全局初始化</text>
  <rect x="1810" y="300" width="470" height="160" rx="24" fill="#D1FAE5" stroke="#047857" stroke-width="5"/>
  <text class="node-title" x="2045" y="365">从hart</text>
  <text class="node-text" x="2045" y="420">软件映像B · 独立任务</text>

  <rect x="1480" y="620" width="490" height="170" rx="24" fill="#A7F3D0" stroke="#047857" stroke-width="5"/>
  <text class="node-title" x="1725" y="690">共享邮箱与IPI（核间中断）</text>
  <text class="node-text" x="1725" y="747">传递命令、参数和结果</text>

  <rect x="1150" y="920" width="330" height="160" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <text class="node-title" x="1315" y="985">hart 0存储区</text>
  <text class="node-text" x="1315" y="1042">由主hart写入</text>
  <rect x="1970" y="920" width="330" height="160" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <text class="node-title" x="2135" y="985">hart 1存储区</text>
  <text class="node-text" x="2135" y="1042">由从hart写入</text>

  <rect x="1450" y="1200" width="620" height="160" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="4"/>
  <text class="note-text" x="1760" y="1275">职责与实时性相互独立</text>
  <text class="note-text" x="1760" y="1328">通过明确的共享区完成通信</text>

  <path class="edge-both" d="M 1530 460 C 1550 520, 1570 570, 1595 620"/>
  <path class="edge-both" d="M 1910 460 C 1890 520, 1875 570, 1850 620"/>
  <path class="edge" d="M 1225 460 C 1200 610, 1205 800, 1315 920"/>
  <path class="edge" d="M 2215 460 C 2240 610, 2235 800, 2135 920"/>

  <g>
    <rect x="1482" y="523" width="152" height="43" rx="7" fill="#ECFDF5"/>
    <text class="edge-text" x="1558" y="555">发布命令</text>
    <rect x="1800" y="523" width="286" height="43" rx="7" fill="#ECFDF5"/>
    <text class="edge-text" x="1943" y="555">读取命令 / 返回结果</text>
    <rect x="1136" y="665" width="152" height="43" rx="7" fill="#ECFDF5"/>
    <text class="edge-text" x="1212" y="697">独立执行</text>
    <rect x="2143" y="665" width="152" height="43" rx="7" fill="#ECFDF5"/>
    <text class="edge-text" x="2219" y="697">独立执行</text>
  </g>
</svg>
