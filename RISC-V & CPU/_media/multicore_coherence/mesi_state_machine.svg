<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1250" viewBox="0 0 1920 1250">
  <defs>
    <marker id="mesi-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .title { font: 700 44px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .panel-title { font: 700 31px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .state { font: 700 38px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .state-sub { font: 500 26px 'Noto Sans CJK SC', sans-serif; fill: #334155; }
      .edge-label { font: 600 25px 'Noto Sans CJK SC', sans-serif; fill: #1D4ED8; }
      .head { font: 700 24px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .cell { font: 500 23px 'Noto Sans CJK SC', sans-serif; fill: #1E293B; }
      .local { stroke: #2563EB; stroke-width: 5; fill: none; marker-end: url(#mesi-blue); }
    </style>
  </defs>

  <rect width="1920" height="1250" fill="#FFFFFF"/>
  <text x="960" y="62" text-anchor="middle" class="title">MESI稳定状态与关键迁移</text>

  <rect x="50" y="100" width="1090" height="1080" rx="24" fill="#F8FAFC" stroke="#2563EB" stroke-width="4"/>
  <text x="595" y="150" text-anchor="middle" class="panel-title">本地CPU请求</text>

  <rect x="150" y="220" width="260" height="130" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="4"/>
  <rect x="780" y="220" width="260" height="130" rx="22" fill="#FECACA" stroke="#DC2626" stroke-width="4"/>
  <rect x="150" y="820" width="260" height="130" rx="22" fill="#E2E8F0" stroke="#475569" stroke-width="4"/>
  <rect x="780" y="820" width="260" height="130" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>

  <text x="280" y="278" text-anchor="middle" class="state">E</text>
  <text x="280" y="319" text-anchor="middle" class="state-sub">Exclusive</text>
  <text x="910" y="278" text-anchor="middle" class="state">M</text>
  <text x="910" y="319" text-anchor="middle" class="state-sub">Modified</text>
  <text x="280" y="878" text-anchor="middle" class="state">I</text>
  <text x="280" y="919" text-anchor="middle" class="state-sub">Invalid</text>
  <text x="910" y="878" text-anchor="middle" class="state">S</text>
  <text x="910" y="919" text-anchor="middle" class="state-sub">Shared</text>

  <line x1="420" y1="285" x2="770" y2="285" class="local"/>
  <text x="595" y="252" text-anchor="middle" class="edge-label">本地写：静默进入M</text>

  <line x1="280" y1="810" x2="280" y2="360" class="local"/>
  <text x="310" y="530" class="edge-label">读未命中</text>
  <text x="310" y="566" class="edge-label">无其他副本</text>

  <line x1="420" y1="885" x2="770" y2="885" class="local"/>
  <text x="595" y="850" text-anchor="middle" class="edge-label">读未命中：已有共享副本</text>

  <line x1="910" y1="810" x2="910" y2="360" class="local"/>
  <text x="940" y="530" class="edge-label">本地写：升级</text>
  <text x="940" y="566" class="edge-label">失效其他副本</text>

  <line x1="412" y1="810" x2="778" y2="360" class="local"/>
  <text x="720" y="620" text-anchor="middle" class="edge-label">写未命中</text>
  <text x="720" y="654" text-anchor="middle" class="edge-label">独占读后进入M</text>

  <rect x="145" y="1015" width="900" height="105" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
  <text x="595" y="1057" text-anchor="middle" class="state-sub">蓝色箭头只表示本地请求完成后的稳定状态。</text>
  <text x="595" y="1096" text-anchor="middle" class="state-sub">总线请求尚未完成时，RTL必须停留在单独的瞬态。</text>

  <rect x="1190" y="100" width="680" height="1080" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="4"/>
  <text x="1530" y="150" text-anchor="middle" class="panel-title">远端监听与替换</text>

  <rect x="1225" y="195" width="610" height="70" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <line x1="1320" y1="195" x2="1320" y2="1110" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="1535" y1="195" x2="1535" y2="1110" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="1640" y1="195" x2="1640" y2="1110" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1272" y="239" text-anchor="middle" class="head">原状态</text>
  <text x="1427" y="239" text-anchor="middle" class="head">事件</text>
  <text x="1587" y="239" text-anchor="middle" class="head">新状态</text>
  <text x="1737" y="239" text-anchor="middle" class="head">必须动作</text>

  <rect x="1225" y="265" width="610" height="155" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1272" y="350" text-anchor="middle" class="cell">E</text>
  <text x="1427" y="330" text-anchor="middle" class="cell">其他核</text>
  <text x="1427" y="365" text-anchor="middle" class="cell">共享读</text>
  <text x="1587" y="350" text-anchor="middle" class="cell">S</text>
  <text x="1737" y="330" text-anchor="middle" class="cell">转为共享</text>
  <text x="1737" y="365" text-anchor="middle" class="cell">无需写回</text>

  <rect x="1225" y="420" width="610" height="170" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1272" y="512" text-anchor="middle" class="cell">M</text>
  <text x="1427" y="490" text-anchor="middle" class="cell">其他核</text>
  <text x="1427" y="525" text-anchor="middle" class="cell">共享读</text>
  <text x="1587" y="512" text-anchor="middle" class="cell">S</text>
  <text x="1737" y="480" text-anchor="middle" class="cell">提供最新数据</text>
  <text x="1737" y="515" text-anchor="middle" class="cell">并使主存储</text>
  <text x="1737" y="550" text-anchor="middle" class="cell">更新</text>

  <rect x="1225" y="590" width="610" height="185" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1272" y="676" text-anchor="middle" class="cell">S/E/M</text>
  <text x="1427" y="655" text-anchor="middle" class="cell">其他核</text>
  <text x="1427" y="690" text-anchor="middle" class="cell">独占读</text>
  <text x="1587" y="676" text-anchor="middle" class="cell">I</text>
  <text x="1737" y="635" text-anchor="middle" class="cell">本地失效</text>
  <text x="1737" y="670" text-anchor="middle" class="cell">M还需提供</text>
  <text x="1737" y="705" text-anchor="middle" class="cell">最新数据</text>

  <rect x="1225" y="775" width="610" height="145" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1272" y="852" text-anchor="middle" class="cell">M</text>
  <text x="1427" y="852" text-anchor="middle" class="cell">替换</text>
  <text x="1587" y="852" text-anchor="middle" class="cell">I</text>
  <text x="1737" y="852" text-anchor="middle" class="cell">写回最新数据</text>

  <rect x="1225" y="920" width="610" height="190" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1272" y="1018" text-anchor="middle" class="cell">S/E</text>
  <text x="1427" y="1018" text-anchor="middle" class="cell">替换</text>
  <text x="1587" y="1018" text-anchor="middle" class="cell">I</text>
  <text x="1737" y="995" text-anchor="middle" class="cell">干净行</text>
  <text x="1737" y="1030" text-anchor="middle" class="cell">直接丢弃</text>

  <line x1="1320" y1="195" x2="1320" y2="1110" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="1535" y1="195" x2="1535" y2="1110" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="1640" y1="195" x2="1640" y2="1110" stroke="#CBD5E1" stroke-width="2"/>
</svg>
