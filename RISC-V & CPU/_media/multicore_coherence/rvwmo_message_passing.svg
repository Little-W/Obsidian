<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1120" viewBox="0 0 1920 1120">
  <defs>
    <marker id="rv-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="rv-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="rv-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 44px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .panel-title { font: 700 30px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .actor { font: 700 27px 'Noto Sans CJK SC', sans-serif; fill: #0F172A; }
      .event { font: 600 25px 'Noto Sans CJK SC', sans-serif; fill: #1E293B; }
      .small { font: 500 22px 'Noto Sans CJK SC', sans-serif; fill: #475569; }
      .result-bad { font: 650 24px 'Noto Sans CJK SC', sans-serif; fill: #991B1B; }
      .result-good { font: 650 24px 'Noto Sans CJK SC', sans-serif; fill: #065F46; }
      .flow-gray { fill: none; stroke: #64748B; stroke-width: 4; marker-end: url(#rv-arrow-gray); }
      .flow-blue { fill: none; stroke: #2563EB; stroke-width: 5; marker-end: url(#rv-arrow-blue); }
      .flow-green { fill: none; stroke: #059669; stroke-width: 5; marker-end: url(#rv-arrow-green); }
      .lifeline { stroke: #94A3B8; stroke-width: 3; stroke-dasharray: 11 10; }
    </style>
  </defs>

  <rect width="1920" height="1120" fill="#FFFFFF"/>
  <text x="960" y="62" text-anchor="middle" class="title">RVWMO下的消息发布与获取</text>

  <rect x="45" y="100" width="880" height="960" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="4"/>
  <text x="485" y="150" text-anchor="middle" class="panel-title">普通访问：不同地址之间未建立明确次序</text>

  <rect x="135" y="190" width="280" height="76" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="3"/>
  <rect x="555" y="190" width="280" height="76" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="3"/>
  <text x="275" y="238" text-anchor="middle" class="actor">hart 0</text>
  <text x="695" y="238" text-anchor="middle" class="actor">hart 1</text>
  <line x1="275" y1="266" x2="275" y2="880" class="lifeline"/>
  <line x1="695" y1="266" x2="695" y2="880" class="lifeline"/>

  <rect x="95" y="320" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
  <text x="275" y="357" text-anchor="middle" class="event">① data = 42</text>
  <text x="275" y="389" text-anchor="middle" class="small">普通写</text>
  <rect x="95" y="480" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
  <text x="275" y="517" text-anchor="middle" class="event">② flag = 1</text>
  <text x="275" y="549" text-anchor="middle" class="small">普通写</text>
  <line x1="275" y1="420" x2="275" y2="470" class="flow-gray"/>

  <rect x="515" y="640" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
  <text x="695" y="677" text-anchor="middle" class="event">③ 读取flag</text>
  <text x="695" y="709" text-anchor="middle" class="small">可能得到1</text>
  <rect x="515" y="800" width="360" height="90" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
  <text x="695" y="837" text-anchor="middle" class="event">④ 读取data</text>
  <text x="695" y="869" text-anchor="middle" class="result-bad">仍可能得到旧值</text>
  <line x1="695" y1="740" x2="695" y2="790" class="flow-gray"/>

  <rect x="110" y="930" width="750" height="82" rx="15" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
  <text x="485" y="963" text-anchor="middle" class="result-bad">程序中的先后书写不等于其他hart观察到的先后关系。</text>
  <text x="485" y="995" text-anchor="middle" class="small">Cache一致性只保证同一地址的值一致，不能代替访问次序控制。</text>

  <rect x="995" y="100" width="880" height="960" rx="24" fill="#ECFDF5" stroke="#059669" stroke-width="4"/>
  <text x="1435" y="150" text-anchor="middle" class="panel-title">发布与获取：使用fence建立保留程序顺序</text>

  <rect x="1085" y="190" width="280" height="76" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
  <rect x="1505" y="190" width="280" height="76" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
  <text x="1225" y="238" text-anchor="middle" class="actor">hart 0：发布</text>
  <text x="1645" y="238" text-anchor="middle" class="actor">hart 1：获取</text>
  <line x1="1225" y1="266" x2="1225" y2="880" class="lifeline"/>
  <line x1="1645" y1="266" x2="1645" y2="880" class="lifeline"/>

  <rect x="1045" y="310" width="360" height="76" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
  <text x="1225" y="358" text-anchor="middle" class="event">① data = 42</text>
  <rect x="1045" y="430" width="360" height="76" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
  <text x="1225" y="478" text-anchor="middle" class="event">② fence rw, w</text>
  <rect x="1045" y="550" width="360" height="76" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
  <text x="1225" y="598" text-anchor="middle" class="event">③ flag = 1</text>
  <line x1="1225" y1="396" x2="1225" y2="420" class="flow-green"/>
  <line x1="1225" y1="516" x2="1225" y2="540" class="flow-green"/>

  <rect x="1465" y="550" width="360" height="76" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
  <text x="1645" y="598" text-anchor="middle" class="event">④ 读取flag，得到1</text>
  <line x1="1415" y1="588" x2="1455" y2="588" class="flow-blue"/>
  <rect x="1465" y="680" width="360" height="76" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
  <text x="1645" y="728" text-anchor="middle" class="event">⑤ fence r, rw</text>
  <rect x="1465" y="810" width="360" height="76" rx="14" fill="#DCFCE7" stroke="#059669" stroke-width="3"/>
  <text x="1645" y="845" text-anchor="middle" class="event">⑥ 读取data</text>
  <text x="1645" y="875" text-anchor="middle" class="result-good">得到42</text>
  <line x1="1645" y1="636" x2="1645" y2="670" class="flow-green"/>
  <line x1="1645" y1="766" x2="1645" y2="800" class="flow-green"/>

  <rect x="1060" y="930" width="750" height="82" rx="15" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/>
  <text x="1435" y="963" text-anchor="middle" class="result-good">写侧先发布数据，再发布标志；读侧先确认标志，再获取数据。</text>
  <text x="1435" y="995" text-anchor="middle" class="small">带rl和aq的原子指令也可分别承担发布与获取作用。</text>
</svg>
